let bulkSel = {};  /* { scope: Set(taskIdString) } — Super Admin bulk-select state */
function bulkSelGet(scope) { if (!bulkSel[scope]) bulkSel[scope] = new Set(); return bulkSel[scope]; }
function bulkSelToggle(scope, id) {
  const s = bulkSelGet(scope);
  const k = String(id);
  if (s.has(k)) s.delete(k); else s.add(k);
  rerenderMain();
}
function bulkSelToggleAll(scope, idsStr) {
  const ids = idsStr ? String(idsStr).split('|').filter(Boolean) : [];
  const s = bulkSelGet(scope);
  const allSel = ids.length > 0 && ids.every(id => s.has(id));
  if (allSel) ids.forEach(id => s.delete(id));
  else ids.forEach(id => s.add(id));
  rerenderMain();
}
function bulkSelClear(scope) { bulkSel[scope] = new Set(); rerenderMain(); }
function bulkApplyStatus(scope, newStatus) {
  const ids = Array.from(bulkSelGet(scope));
  if (ids.length === 0) return;
  if (!newStatus) { alert("Pick a status first."); return; }
  if (ids.length >= 10 && !confirm("Change status of " + ids.length + " task(s) to \"" + newStatus + "\"?")) return;
  let changed = 0;
  ids.forEach(id => {
    const t = state.tasks.find(x => String(x.id) === String(id));
    if (!t || t.deleted) return;
    if (t.status === newStatus) return;
    const oldStatus = t.status;
    t.status = newStatus;
    t.mt = Date.now();
    logActivity(t.id, "status_changed", oldStatus, newStatus);
    if (_PRE_DONE.includes(oldStatus == null ? '' : String(oldStatus)) && _POST_DONE.includes(newStatus)) {
      t.doneAt = Date.now();
    }
    /* Auto-fill default amount on bulk transition into any amount-carrying status */
    if (AMOUNT_STATUSES.includes(newStatus) && (t.amount == null) && DEFAULT_AMOUNTS[t.task]) {
      t.amount = DEFAULT_AMOUNTS[t.task];
    }
    changed++;
  });
  bulkSel[scope] = new Set();
  save();
  rerenderMain();
}

function setTaskAmount(id, value) {
  const t = state.tasks.find(x => String(x.id) === String(id));
  if (!t) return;
  const raw = String(value || '').trim();
  const num = raw === '' ? null : Math.max(0, Math.floor(Number(raw)) || 0);
  if ((t.amount || null) === num) return;
  t.amount = num;
  t.mt = Date.now();
  save();
}
/* ---- GST REGISTRATION done => the client joins a GST module ----
   The registration task ending means a real registered client now exists, and the ongoing
   returns work starts somewhere: the monthly/quarterly GST tab or the Composition tab. The
   company name comes off the task; the dialog collects what those tabs actually key on.
   Offered once, at the moment the status crosses into Done \u2014 declining just leaves the
   task Done and the client can be added by hand later. */
function gstRegOnboard(t) {
  const name = String(t.client || "").trim();
  if (!name) return;
  gstPrompt("Registration done \u2014 add " + name + " to a GST tab?", [
    { label: "File under", value: "M",
      options: [["M", "GST \u2014 Monthly"], ["Q", "GST \u2014 Quarterly (QRMP)"], ["C", "GST Composition"]] },
    { label: "GSTIN", value: "", placeholder: "15-character GSTIN" },
    { label: "Contact person", value: "", placeholder: "Who to speak to" },
    { label: "Mobile", value: "", placeholder: "10-digit number becomes WhatsApp" },
    { label: "Portal user ID", value: "", placeholder: "GST portal login" },
    { label: "Portal password", value: "", placeholder: "GST portal password" }
  ], vals => {
    const dest = vals[0];
    const gstin = String(vals[1] || "").toUpperCase().replace(/\s/g, "");
    if (!gstin) return "The GSTIN is what the GST tabs file a client under \u2014 it is on the registration certificate.";
    if (!/^\d{2}[A-Z]{5}\d{4}[A-Z]\d[A-Z0-9][A-Z0-9]$/.test(gstin)) return "That is not a valid 15-character GSTIN.";
    const list = dest === "C" ? (state.gcClients = state.gcClients || []) : (state.gstClients = state.gstClients || []);
    const dup = list.find(c => c && !c.deleted && (c.k === gstin || String(c.n || "").toLowerCase() === name.toLowerCase()));
    if (dup) return name + " is already in that tab (as " + dup.n + "). Nothing to add.";
    const ph = String(vals[3] || "").trim();
    const row = { id: gstin, k: gstin, n: name.toUpperCase(),
                  cp: String(vals[2] || "").trim().toUpperCase(), ph,
                  /* spaces stripped first: numbers are habitually written "98765 43210" here */
                  wa: (ph.replace(/[^0-9]/g, "").match(/\d{10}/) || [])[0] || "", src: "",
                  gst: gstin, un: String(vals[4] || "").trim(), pw: String(vals[5] || "").trim(),
                  p: t.assignee || currentActor(), mt: Date.now() };
    if (dest === "C") row.act = "A"; else row.mq = dest;
    list.push(row);
    save(); rerenderMain();
    gstAlert(name + " added to " + (dest === "C" ? "GST Composition" : "GST (" + (dest === "M" ? "Monthly" : "Quarterly") + ")")
      + ", assigned to " + displayName(row.p) + ".");
  });
}

function updateField(id, field, value) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const oldValue = t[field];
  if (oldValue === value) return;
  t[field] = value;
  t.mt = Date.now();
  if (field === "status") {
    logActivity(id, "status_changed", oldValue, value);
    /* Completion stamp: only when crossing from a pre-Done status into a post-Done one.
       Moving Done -> Billed -> Received leaves the original done date untouched. */
    if (_PRE_DONE.includes(oldValue == null ? '' : String(oldValue)) && _POST_DONE.includes(value)) {
      t.doneAt = Date.now();
    }
    /* Auto-fill default amount on transition into any status that carries an amount */
    if (AMOUNT_STATUSES.includes(value) && (t.amount == null) && DEFAULT_AMOUNTS[t.task]) {
      t.amount = DEFAULT_AMOUNTS[t.task];
    }
  }
  else if (field === "assignee") logActivity(id, "reassigned", oldValue, value);
  /* Release focus from the inline select BEFORE save+render so polling isn't blocked
     by a focused inline cell select that the user has already finished with. */
  if (document.activeElement && document.activeElement.tagName === 'SELECT' && document.activeElement.classList.contains('inline')) {
    try { document.activeElement.blur(); } catch (e) {}
  }
  save();
  if (field === "assignee" || field === "status") render();
  else renderTabs();
  /* Switching INTO On Hold: pop the reason editor open right away, so the "why" gets typed
     in the same motion as the status change. */
  if (field === "status" && value === "On Hold") {
    _holdPopOpen = id;
    rerenderMain();
    _mountHoldPop(id);
  }
  /* a GST REGISTRATION crossing into Done is a new registered client \u2014 offer to file them */
  if (field === "status" && value === "Done" && /^GST REGISTRATION/i.test(String(t.task || "").trim())
      && !_POST_DONE.includes(oldValue == null ? "" : String(oldValue))) {
    setTimeout(() => gstRegOnboard(t), 0);
  }
}

function importClientsFromExcel(e) {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  loadSheetJS(() => {
    const XLSX = window.XLSX;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
        let added = 0, updated = 0, skipped = 0;
        for (let i = 0; i < rows.length; i++) {
          const row = rows[i] || [];
          const name = String(row[0] || "").trim();
          const business = String(row[1] || "").trim();
          const mobile = normalizeMobile(row[2]);
          if (i === 0 && /^client\s*name$|^name$/i.test(name)) continue;
          if (!name) { skipped++; continue; }
          if (state.clients.includes(name)) {
            updated++;
          } else {
            state.clients.push(name);
            added++;
          }
          if (business) {
            if (!state.clientBusiness) state.clientBusiness = {};
            state.clientBusiness[name] = business;
          }
          if (mobile) {
            if (!state.clientMobile) state.clientMobile = {};
            state.clientMobile[name] = mobile;
          }
        }
        state.clients = uniqSorted(state.clients);
        save();
        const status = document.getElementById("importClientsStatus");
        if (status) {
          status.textContent = "✓ " + added + " added, " + updated + " updated" + (skipped ? ", " + skipped + " skipped" : "");
        }
        setTimeout(() => render(), 1200);
      } catch (err) {
        alert("Could not import: " + err.message + "\nFile must have: Client Name (col A), Business Name (col B), Mobile (col C).");
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][t.getMonth()];
  return String(t.getDate()).padStart(2, '0') + '-' + mon + '-' + String(t.getFullYear()).slice(2);

function renderAcctFin() {
  const u = afUser(), kind = afKind();
  const live = afLive().slice().sort((a, b) => ((Number(a.sr) || 0) - (Number(b.sr) || 0)) || String(a.client).localeCompare(String(b.client)));
  const na = live.filter(r => r.acct === u).length, nf = live.filter(r => r.fin === u).length;
  /* Active sub-view. Admins get "All clients" plus personal My-accounting /
     My-finalisation views whenever they hold assignments themselves. */
  let sub = afTab;
  if (kind === "admin") {
    if (!["all", "acct", "fin"].includes(sub)) sub = "all";
  } else if (kind === "both") {
    if (sub !== "acct" && sub !== "fin") sub = "acct";
  } else {
    sub = kind; /* single-role users: view always matches their role */
  }
  let rows;
  if (kind === "admin") rows = (sub === "acct") ? live.filter(r => r.acct === u) : (sub === "fin") ? live.filter(r => r.fin === u) : live;
  else if (kind === "acct") rows = live.filter(r => r.acct === u);
  else if (kind === "fin") rows = live.filter(r => r.fin === u);
  else rows = (sub === "acct") ? live.filter(r => r.acct === u) : live.filter(r => r.fin === u);
  if (afCx) rows = rows.filter(r => r.complex === afCx);
  if (kind === "admin" && afName.length) rows = rows.filter(r => afName.includes(r.acct) || afName.includes(r.fin));
  if (afSearch) { const q = afSearch.toLowerCase(); rows = rows.filter(r => String(r.client).toLowerCase().includes(q)); }
  if (afColF.stage.length) rows = rows.filter(r => afColF.stage.includes(r.stage || "Not Started"));
  if (afColF.audit.length) rows = rows.filter(r => afColF.audit.includes(r.audit ? r.audit : "_unset"));
  if (afColF.rem) { const q = afColF.rem.toLowerCase(); rows = rows.filter(r => ((r.aRem || "") + " " + (r.fRem || "")).toLowerCase().includes(q)); }
  if (afColF.role.length) rows = rows.filter(r => afColF.role.includes(sub === "fin" ? r.acct : r.fin));

  /* sub-tab / scope widget in the module header */
  let tabsHTML;
  const rtab = (key, label, n) => '<button class="af-rtab ' + (sub === key ? 'on' : '') + '" onclick="afSetTab(\'' + key + '\')">' + label + ' <span class="af-cnt">' + n + '</span></button>';
  if (kind === "admin") {
    /* Admins always get the combined table plus their personal views */
    tabsHTML = '<div class="af-roletabs">' + rtab('all', 'All clients', live.length)
      + rtab('acct', 'My accounting', na) + rtab('fin', 'My finalisation', nf) + '</div>';
  } else if (kind === "both") {
    tabsHTML = '<div class="af-roletabs">' + rtab('acct', 'My accounting', na) + rtab('fin', 'My finalisation', nf) + '</div>';
  } else if (kind === "acct") {
    tabsHTML = '<span class="af-rolechip">My accounting &middot; ' + na + ' clients</span>';
  } else {
    tabsHTML = '<span class="af-rolechip">My finalisation &middot; ' + nf + ' clients</span>';
  }

  const yearHTML = (u === "Super Admin")
    ? '<span class="af-yr" onclick="afEditYear()" title="Click to change the financial year label">F.Y. ' + escapeHTML(state.afYear) + '</span>'
    : 'F.Y. ' + escapeHTML(state.afYear);

  const cxBtn = (val, label, dot) =>
    '<button class="af-cxb ' + (afCx === val ? 'on' : '') + '" onclick="afSetCx(\'' + val + '\')">' + (dot ? '<span class="af-dot" style="background:' + dot + '"></span>' : '') + label + '</button>';
  /* small + beside the Client column heading (admins only) — same affordance as the task tables */
  const addTh = afUser()
    ? '<button type="button" class="add-task-btn ' + (afAddOpen ? 'is-open' : '') + '" onclick="afAddToggle()" title="' + (afAddOpen ? 'Close the add-client row' : 'Add a client to this module') + '">' + icon('plus', 13) + '</button>' : '';

  let addForm = '';
  if (afAddOpen && afUser()) {
    const people = allAssignees();
    const me = afUser();
    /* An employee adding a client is almost always adding their own, so they start as the
       accountant — otherwise the new row would drop straight out of their view. */
    const opt = (p, sel) => '<option value="' + escapeAttr(p) + '"' + (p === sel ? ' selected' : '') + '>' + escapeHTML(displayName(p)) + '</option>';
    const acctOpts = people.map(p => opt(p, afIsAdmin() ? null : me)).join('');
    const finOpts = people.map(p => opt(p, null)).join('');
    const nextSr = live.reduce((m, r) => Math.max(m, Number(r.sr) || 0), 0) + 1;
    addForm = '<div class="af-addform">'
      + '<input id="af-add-sr" type="number" min="1" value="' + nextSr + '" title="Sr no." style="width:64px">'
      + '<input id="af-add-client" list="af-clients-dl" placeholder="Client name" style="min-width:200px" oninput="afAddFillMobile(this.value)">'
      + '<datalist id="af-clients-dl">' + (state.clients || []).map(c => '<option value="' + escapeAttr(c) + '">').join('') + '</datalist>'
      + '<input id="af-add-mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="Mobile (required)" style="width:150px" oninput="afMobInput(this)" title="10-digit mobile - required to add a client">'
      + '<label style="font-size:11px;font-weight:600;color:var(--n500)">Acc</label><select id="af-add-acct">' + acctOpts + '<option value="Client">Client (own books)</option></select>'
      + '<label style="font-size:11px;font-weight:600;color:var(--n500)">Fin</label><select id="af-add-fin">' + finOpts + '<option value="Client">Client (own books)</option><option value="">— none —</option></select>'
      /* complexity is an admin call — employees leave it unset for an admin to grade later */
      + (afIsAdmin() ? '<select id="af-add-cx"><option>Low</option><option>Moderate</option><option>High</option></select>' : '')
      + '<input id="af-add-target" type="date" title="Target date (optional)">'
      + '<button class="af-go" onclick="afAddClient()">Add</button>'
      + '</div>';
  }

  let thead, rowFn;
  const mode = (kind === "admin" && sub === "all") ? "admin" : (sub === "fin") ? "fin" : "acct";
  if (mode === "admin") {
    thead = '<tr><th>Sr</th><th>Client' + addTh + '</th><th>Team</th><th style="text-align:right">Accounting</th><th style="text-align:right">Finalisation</th><th>Audit stage</th><th style="text-align:center">Audit</th><th>Target</th><th>Remarks</th><th></th></tr>';
    rowFn = afAdminRow;
  } else if (mode === "acct") {
    thead = '<tr><th>Sr</th><th>Client' + addTh + '</th><th style="text-align:right">Accounting %</th><th style="text-align:right">Finalisation %</th><th style="text-align:center">Docs</th><th style="text-align:center">Audit</th><th>Target</th><th>Remark</th><th>Finaliser</th><th></th></tr>';
    rowFn = afAcctRow;
  } else {
    thead = '<tr><th>Sr</th><th>Client' + addTh + '</th><th>Audit stage</th><th style="text-align:right">Accounting %</th><th style="text-align:right">Finalisation %</th><th style="text-align:center">Audit</th><th>Target</th><th>Remark</th><th>Accountant</th><th></th></tr>';
    rowFn = afFinRow;
  }
  const emptyMsg = (kind !== "admin" && afTabCount() === 0)
    ? 'No clients assigned to you yet — ask admin to add you on the Accounting &amp; Finalisation module.'
    : 'No clients in this view.';
  const body = rows.length ? rows.map(rowFn).join('') : '<tr><td colspan="10"><div class="af-empty">' + emptyMsg + '</div></td></tr>';

  const tabTxt = (sub === 'acct') ? ' &middot; my accounting' : (sub === 'fin') ? ' &middot; my finalisation' : '';
  const foot = '<b>Pujara &amp; Co.</b> &middot; ' + rows.length + ' client' + (rows.length !== 1 ? 's' : '') + ' in your view' + tabTxt + (afCx ? ' &middot; ' + afCx + ' complexity' : '');

  /* ---- Tasks-style per-column filter row (lives inside thead, below the headers) ---- */
  const people = allAssignees();
  /* the same checkbox-filter cell the GST and TDS tables use, wired to af state */
  const chk = (field, label, opts) => {
    const cur = field === "person" ? afName : afColF[field];
    const open = afFOpen === field;
    const txt = !cur.length ? "All"
      : cur.length === 1 ? String((opts.find(o => o[0] === cur[0]) || ["", cur[0]])[1])
      : cur.length + " selected";
    return '<div class="gst-cf' + (open ? " open" : "") + '">'
      + '<button type="button" class="gst-cf-btn' + (cur.length ? " on" : "") + '" onclick="afFToggle(\'' + field + '\',event)"'
        + ' title="' + escapeAttr("Filter by " + label) + '"><span>' + escapeHTML(txt) + "</span>" + icon("chevron-down", 11) + "</button>"
      + (open ? '<div class="gst-cf-menu" onclick="event.stopPropagation()">'
          + '<label class="gst-cf-opt all"><input type="checkbox"' + (cur.length ? "" : " checked")
            + ' onchange="afFAll(\'' + field + '\')">All</label>'
          + opts.map(o => '<label class="gst-cf-opt"><input type="checkbox"' + (cur.includes(o[0]) ? " checked" : "")
              + ' onchange="afFPick(\'' + field + '\',\'' + escapeAttr(o[0]) + '\',this.checked)">' + escapeHTML(o[1]) + "</label>").join("")
          + "</div>" : "")
      + "</div>";
  };
  const personOpts = withClient => people.map(p => [p, displayName(p)])
    .concat(withClient ? [["Client", "Client (own books)"]] : []);
  const clientFi = '<input id="af-cf-client" type="text" value="' + escapeAttr(afSearch) + '" placeholder="Search client…" oninput="afColText(\'client\',this)">';
  const remFi = '<input id="af-cf-rem" type="text" value="' + escapeAttr(afColF.rem) + '" placeholder="Search remarks…" oninput="afColText(\'rem\',this)">';
  const stageFi = chk("stage", "audit stage", AF_STAGES.map(x => [x, x]));
  const auditFi = chk("audit", "audit", [["Y","Y"],["N","N"],["NA","NA"],["_unset","Not set"]]);

/* ==================== GST COMPOSITION ====================
   Composition dealers file quarterly: CMP-08 for the payment, GSTR-4 once a year. So the
   period here is a quarter, not a month, and the work is a chain — get the bank credits and
   the purchase data in, agree the figures, raise the challan, file. The module mirrors the
   GST tab deliberately: same card, same filters, same period control, so nothing has to be
   learned twice. Clients and quarterly records sync by id with the newer change winning. */
let gcQ = "";                 /* selected quarter, e.g. '2026-27-Q1' (view state, not synced) */
let gcScope = "all";
let gcF = { q: "", person: [], bk: [], pd: [], sd: [], cs: [], fl: [], act: [], note: "", rem: "" };
let gcFOpen = "";
let gcSort = { col: "n", dir: "asc" };
const gcOpen = new Set();

const GC_DS   = [["NS","Not started"],["CALL","Called"],["RECD","Received"],["NIL","Nil"]];
/* No "Not started": for these three it meant the same as Pending. gcRecd() below reads any
   record still holding the old value as Pending. */
const GC_RECD = [["PEND","Pending"],["RECD","Received"],["NIL","Nil"],["NA","NA"]];
const GC_CS   = [["NS","Not started"],["SENT","Sent"],["DONE","Paid"],["NA","NA"]];
const GC_FL   = [["NF","Not filed"],["F","Filed"]];
/* Client status. Shared by the GST and Composition modules — defined here because
   Composition was written first, not because it belongs to it. */
const ACT_OPTS = [["A","Active"],["X","Not to do"],["C","Cancelled"]];
const GC_MAP  = o => Object.fromEntries(o.map(x => [x[0], x[1]]));
const GC_DSM = GC_MAP(GC_DS), GC_RECDM = GC_MAP(GC_RECD), GC_CSM = GC_MAP(GC_CS),
      GC_FLM = GC_MAP(GC_FL), ACT_LBL = GC_MAP(ACT_OPTS);
/* the seven figures, in the order they are worked out */
const GC_MONEY = [["cd","Bank — cash deposit"],["oc","Bank — other than cash"],
                  ["st","Sale — taxable"],["sz","Sale — zero / exempt"],
                  ["pa","Purchase amount"],["p4","Purchase as per 4A"],["ca","Challan amount"]];

function gcLive() { return (state.gcClients || []).filter(c => c && !c.deleted); }
function gcById(k) { return gcLive().find(c => c.k === k); }
function gcUser() { return state.session && state.session.user; }
function gcIsAdmin() { return ADMINS.includes(gcUser()); }
function gcCanEdit(c) { return gcIsAdmin() || (c && c.p === gcUser()); }
function gcTabCount() {
  if (!gcUser()) return 0;
  return gcIsAdmin() ? gcLive().length : gcLive().filter(c => c.p === gcUser()).length;
}

/* ---- quarters ---- */
function gcQParse(id) {
  const m = String(id).match(/^(\d{4})-(\d{2})-Q([1-4])$/);
  return m ? { fy: m[1] + "-" + m[2], start: +m[1], q: +m[3] } : null;
}
function gcQKey(id) { const p = gcQParse(id); return p ? p.start * 4 + p.q : 0; }
const GC_QMON = { 1: ["Apr","Jun",0], 2: ["Jul","Sep",0], 3: ["Oct","Dec",0], 4: ["Jan","Mar",1] };
function gcQMonths(id) {
  const p = gcQParse(id); if (!p) return "";
  const m = GC_QMON[p.q];
  return m[0] + "–" + m[1] + " " + (p.start + m[2]);
}
function gcQLabel(id) { const p = gcQParse(id); return p ? ("Q" + p.q + " · " + gcQMonths(id)) : String(id); }
function gcQFull(id) { const p = gcQParse(id); return p ? (gcQLabel(id) + "  ·  FY " + p.fy) : String(id); }
function gcQNext(id) {
  const p = gcQParse(id); if (!p) return null;
  if (p.q < 4) return p.fy + "-Q" + (p.q + 1);
  const ns = p.start + 1;
  return ns + "-" + String((ns + 1) % 100).padStart(2, "0") + "-Q1";
}
function gcQuarters() {
  const out = (state.gcQuarters || []).filter(p => p && !p.del).map(p => p.id);
  return (out.length ? out : ["2026-27-Q1"]).sort((a, b) => gcQKey(a) - gcQKey(b));
}
function gcQRec(id) {
  if (!Array.isArray(state.gcQuarters)) state.gcQuarters = [];
  let p = state.gcQuarters.find(x => x && x.id === id);
  if (!p) { p = { id, del: 0, mt: 0 }; state.gcQuarters.push(p); }
  return p;
}
/* The quarter just gone is the one being worked on, the same way the GST tab opens on last
   month. Falls back to the newest quarter that is not in the future. */
function gcLastQuarter() {
  const d = new Date(), m = d.getMonth(), y = d.getFullYear();
  const q = m < 3 ? 4 : m < 6 ? 1 : m < 9 ? 2 : 3;      /* the quarter we are inside */
  const prevQ = q === 1 ? 4 : q - 1;
  let start = (m < 3) ? y - 1 : y;                      /* FY starts in April */
  if (q === 1) start -= 1;                              /* Q1 -> previous FY's Q4 */
  return start + "-" + String((start + 1) % 100).padStart(2, "0") + "-Q" + prevQ;
}
function gcCurQ() {
  const qs = gcQuarters();
  if (!gcQ || !qs.includes(gcQ)) {
    const want = gcLastQuarter();
    if (qs.includes(want)) gcQ = want;
    else {
      const past = qs.filter(x => gcQKey(x) <= gcQKey(want));
      gcQ = past.length ? past[past.length - 1] : qs[0];
    }
  }
  return gcQ;
}

/* ---- records: a transient blank for untouched clients, materialised only on a write ---- */
function gcBlank(k, q) {
  return { id: k + "|" + q, k, q, ds: "NS", note: "", bk: "PEND", pd: "PEND", sd: "PEND",
           cd: "", oc: "", st: "", sz: "", pa: "", p4: "", ca: "",
           cs: "NS", fl: "NF", rem: "", mt: 0 };
}
function gcRec(k) {
  const q = gcCurQ(), id = k + "|" + q;
  return (state.gcRows || []).find(x => x && x.id === id && !x.deleted) || gcBlank(k, q);
}
function gcRecW(k) {
  const q = gcCurQ(), id = k + "|" + q;
  if (!Array.isArray(state.gcRows)) state.gcRows = [];
  let r = state.gcRows.find(x => x && x.id === id && !x.deleted);
  const gone = !r && state.gcRows.find(x => x && x.id === id);
  if (gone) { delete gone.deleted; delete gone.deletedAt; r = gone; }
  if (!r) { r = gcBlank(k, q); state.gcRows.push(r); }
  return r;
}
/* Bank / Purchase / Sales no longer offer "Not started". Rows written before that \u2014
   including ones syncing in from someone else's browser \u2014 still carry NS, and are read
   as Pending. Nothing is rewritten: the value is only mapped as it is used. */
function gcRecd(v) { return (!v || v === "NS") ? "PEND" : v; }
/* Has anything actually been done on this record? Pending on the three data columns means
   nothing has — and since Pending is now where a record starts, it cannot be tested by
   asking whether the value has changed. */
function gcWorked(r) {
  return ["bk", "pd", "sd"].some(f => gcRecd(r[f]) !== "PEND")
    || (r.cs && r.cs !== "NS") || r.fl === "F" || !!r.rem || gcHasFigures(r);
}
function gcTouch(r) { r.mt = Date.now(); save(); }

/* ---- money ---- */
function gcNum(v) {
  if (v == null || String(v).trim() === "" || String(v).trim() === "-") return null;
  const n = Number(String(v).replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? null : n;
}
/* Indian grouping: the last three digits, then pairs. */
function gcInr(n) {
  if (n == null) return "";
  const neg = n < 0; let s = Math.round(Math.abs(n)).toString();
  let last3 = s.slice(-3), rest = s.slice(0, -3);
  if (rest) last3 = "," + last3;
  rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",");
  return (neg ? "-" : "") + rest + last3;
}
function gcHasFigures(r) { return GC_MONEY.some(m => { const n = gcNum(r[m[0]]); return n != null && n !== 0; }); }

/* Where a client has got to this quarter. The order matters: the later a stage, the more it
   tells you, so it is tested first. */
function gcStage(c) {
  if (c.act && c.act !== "A") return "skip";
  const r = gcRec(c.k);
  if (r.bk === "NIL" || r.pd === "NIL" || r.sd === "NIL") return "nil";
  if (r.fl === "F") return "filed";
  if (r.cs === "SENT" || r.cs === "DONE") return "challan";
  if (gcHasFigures(r)) return "ready";
  if (r.bk === "RECD" || r.pd === "RECD" || r.sd === "RECD") return "datain";
  return "await";
}

/* ---- scope & filters ---- */
/* How far the quarter has got.

   Seven exclusive buckets answered "where is each client filed away", which is not what
   anyone asks. A composition quarter is a pipeline — data in, figures worked out, challan
   raised, return filed — and what you want to see is how many have reached each step and
   where the work is piling up. Counts are cumulative, so a client whose figures are entered
   is also counted as having their data; the buckets hid that.

   Nil returns and clients marked not to do are taken out of the denominator: they are not
   work, and leaving them in made every step look permanently short. */
const GC_RANK = { await: 0, datain: 1, ready: 2, challan: 3, filed: 4, nil: -1, skip: -1 };
function gcRank(c) { const r = GC_RANK[gcStage(c)]; return r === undefined ? 0 : r; }
function gcCounts(list) {
  const out = { total: list.length, active: 0, nil: 0, skip: 0, step: [0, 0, 0, 0, 0] };
  list.forEach(c => {
    const st = gcStage(c);
    if (st === "nil") { out.nil++; return; }
    if (st === "skip") { out.skip++; return; }
    out.active++;
    for (let i = 1; i <= GC_RANK[st]; i++) out.step[i]++;
  });
  return out;
}
/* rank, card label, and what reaching that step means */
const GC_STEPS = [
  [1, "Data in",         "bank, purchase or sales received"],
  [2, "Figures entered", "at least one amount worked out"],
  [3, "Challan sent",    "challan sent or paid"],
  [4, "Filed",           "CMP-08 filed"]
];
/* Clicking a step shows what has NOT reached it yet — the work it still stands for. */
function gcStepClick(n) {
  const was = gcF.__short === n, q = gcF.q;
  gcClearFilters();
  gcF.q = q;
  if (!was) gcF.__short = n;
  rerenderMain();
}

function gcScopeKeys() {
  const live = gcLive();
  if (!gcIsAdmin()) return live.filter(c => c.p === gcUser());
  return gcScope === "mine" ? live.filter(c => c.p === gcUser()) : live;
}
function gcFOn(field, v) { const a = gcF[field] || []; return !a.length || a.includes(v); }
function gcFToggle(field, ev) {

  rerenderMain();
  const el = document.getElementById("gc-f-" + gcFOpen);      /* a search opens ready to type */
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function gcFPick(field, val, on) {
  const cur = (gcF[field] || []).slice(), i = cur.indexOf(val);
  if (on && i < 0) cur.push(val);
  if (!on && i >= 0) cur.splice(i, 1);
  gcF[field] = cur; rerenderMain();
}
function gcFAll(field) { gcF[field] = []; rerenderMain(); }
document.addEventListener("click", () => { if (gcFOpen) { gcFOpen = ""; rerenderMain(); } });
function gcAnyFilter() {
  return !!(gcF.q || gcF.note || gcF.rem || gcF.__short || gcF.__stage)
    || ["person","bk","pd","sd","cs","fl","act"].some(f => (gcF[f] || []).length);
}
function gcClearFilters() {
  gcF = { q: "", person: [], bk: [], pd: [], sd: [], cs: [], fl: [], act: [], note: "", rem: "" };
  gcFOpen = ""; rerenderMain();
}
function gcSetFilter(field, v) {
  gcF[field] = v; rerenderMain();
  if (field === "q" || field === "rem" || field === "note") {
    const el = document.getElementById("gc-f-" + field);

  }
}
function gcVisible() {
  let list = gcScopeKeys();

  if (q) list = list.filter(c => (c.n || "").toLowerCase().includes(q) || (c.gst || "").toLowerCase().includes(q)
    || (c.cp || "").toLowerCase().includes(q) || String(c.ph || "").includes(q));
  list = list.filter(c => gcFOn("person", c.p || "__none") && gcFOn("act", c.act || "A"));
  list = list.filter(c => {

      && gcFOn("cs", r.cs || "NS") && gcFOn("fl", r.fl || "NF");
  });

  if (gcF.rem) { const rq = gcF.rem.toLowerCase(); list = list.filter(c => (gcRec(c.k).rem || "").toLowerCase().includes(rq)); }
  const ORD = (arr, v) => { const i = arr.findIndex(x => x[0] === v); return i < 0 ? 0 : i; };

  /* Nil returns and not-to-do clients are not steps and are not work: they trail the

  /* Each heading carries whatever narrowing it can usefully offer: a search where the

  const people = allAssignees();

          + "</div>"
          + (open ? '<div class="gcx-detail">' + gcDetail(c, r, ed) + "</div>" : "")

  return '<div class="card af-mod mod-fill gcx">'
    + '<div class="af-modhead"><div class="af-modtitle">GST Composition<small>' + qSel + "</small></div>"
      + (gcAnyFilter() ? '<button type="button" class="gcx-clear" onclick="gcClearFilters()" title="Clear every filter">'

    + `<div class="af-footbar"><b>Pujara &amp; Co.</b> &middot; ${rows.length} of ${n} client${n === 1 ? "" : "s"}`
    + ` &middot; ${escapeHTML(gcQFull(cur))} &middot; ${filedN} filed`
    + '<span style="margin-left:auto">CMP-08 is due on the 18th of the month after the quarter.</span></div></div>';
}

/* ==================== GST COMPLIANCE MODULE ====================
   One row per client per month. A client is Monthly (M) or Quarterly/QRMP (Q); the
   quarterly ones file GSTR-1 + GSTR-3B only in Jun/Sep/Dec/Mar and use IFF + PMT-06 in
   the two months between, which is why the reminder drafts are chosen per client type.
   Clients sync like tasks (by id, newer mt wins); monthly records are their own rows so
   two people working different clients never overwrite each other. */
let gstMonth = "";              /* selected period, e.g. 'Sep 26' (view state, not synced) */
let gstScope = "all";           /* 'all' | 'mine'; employees are pinned to their own list */
let gstF = { q: "", person: [], mq: [], s: [], g1: [], pt: [], b3: [], rem: "" };   /* [] means "all" */
let gstFOpen = "";              /* which column's checkbox list is open */
let gstSort = { col: "n", dir: "asc" };   /* column sort, toggled by clicking a heading */
const gstOpen = new Set();      /* expanded client detail rows */

const GST_MSEQ = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const GST_MFULL = { Jan:"January", Feb:"February", Mar:"March", Apr:"April", May:"May", Jun:"June",
                    Jul:"July", Aug:"August", Sep:"September", Oct:"October", Nov:"November", Dec:"December" };
/* GSTR-3B pipeline: pending -> 2B shared -> reco shared -> challan saved -> filed */
const GST_B3 = [["PEND","Not started"],["PROC","In process"],["2B","2B Sent"],
                ["RECO","Reco Sent"],["CHLN","Challan Saved"],["FILED","Filed"],["NOTAX","No Tax"]];
/* Nothing further is owed in either of these — No Tax counts as settled, otherwise a client
   with no liability would be flagged as outstanding for that period forever. */
const GST_B3DONE = ["FILED","NOTAX"];
const GST_B3MAP = Object.fromEntries(GST_B3.map(x => [x[0], x]));
/* GSTR-1 / IFF: the same four stages the task tables use, so the colours read the same */
const GST_G1 = [["NS","Not started"],["IP","In progress"],["OH","On hold"],["F","Filed"]];
const GST_G1MAP = Object.fromEntries(GST_G1.map(x => [x[0], x]));
const GST_FIRM = "Pujara & Co., Chartered Accountants";
const GST_FIRMPH = "90168 75077";

function gstLive() { return (state.gstClients || []).filter(c => c && !c.deleted); }
function gstById(k) { return gstLive().find(c => c.k === k); }
/* Periods, oldest first. Each one carries its own del flag and timestamp, so removing a
   period and adding it back are ordinary edits that merge like any other. */
function gstMonthKey(m) {
  const [mo, yr] = String(m).split(" ");
  return (2000 + Number(yr || 0)) * 12 + Math.max(0, GST_MSEQ.indexOf(mo));
}
function gstMonths() {
  const out = (state.gstPeriods || []).filter(p => p && !p.del).map(p => p.id);
  return (out.length ? out : ["Sep 26"]).sort((a, b) => gstMonthKey(a) - gstMonthKey(b));
}
/* The stored period, created on demand — a period removed earlier is reused rather than
   duplicated, which is what lets it come back with its records intact. */
function gstPeriodRec(label) {
  if (!Array.isArray(state.gstPeriods)) state.gstPeriods = [];
  let p = state.gstPeriods.find(x => x && x.id === label);
  if (!p) { p = { id: label, del: 0, mt: 0 }; state.gstPeriods.push(p); }
  return p;
}
/* Clients with anything recorded in a period — shown before removing it, and the reason
   removal only hides the period instead of deleting the rows underneath it. */
function gstPeriodFilled(m) {
  return (state.gstRows || []).filter(r => r && r.m === m && !r.deleted
    && (r.s || r.pt || r.sd || r.ptd || r.rem || r.rem1 || (r.g1 && r.g1 !== "NS") || (r.b3 && r.b3 !== "PEND"))).length;
}
/* Everything still outstanding for this client in EARLIER periods, grouped by side:
   the sales side is the sales data + GSTR-1/IFF, the purchase side is the purchase data
   + GSTR-3B/PMT. A period nobody touched counts as outstanding, not as done. */
function gstPastOutstanding(k, side) {
  const curK = gstMonthKey(gstCurMonth());
  const rows = state.gstRows || [];
  const out = [];
  gstMonths().forEach(m => {
    if (gstMonthKey(m) >= curK) return;
    const r = rows.find(x => x && x.id === k + "|" + m && !x.deleted);
    const items = [];
    if (side === "r1") {
      if (!r || !r.s) items.push("sales data");
      if (!r || r.g1 !== "F") items.push("GSTR-1 / IFF not filed");
    } else {
      if (!r || !r.pt) items.push("purchase data");
      if (!r || !GST_B3DONE.includes(r.b3)) items.push(gstColB3(m) + " not filed");   /* that period's label, not this one's */
    }
    if (items.length) out.push(m + ": " + items.join(" + "));
  });
  return out;
}
function gstWarnDot(k, side) {
  const late = gstPastOutstanding(k, side);
  if (!late.length) return "";
  return '<span class="gst-warn" title="' + escapeAttr("Still pending from earlier — " + late.join(" · ")) + '">' + late.length + "</span>";
}
/* The month just gone is the one being worked on — in September you are filing August —
   so that is what opens. If it is not on the list yet, fall back to the newest period that
   is not in the future rather than jumping ahead to a month nobody has started. */
function gstLastMonthLabel() {
  const d = new Date(), p = new Date(d.getFullYear(), d.getMonth() - 1, 1);
  return GST_MSEQ[p.getMonth()] + " " + String(p.getFullYear()).slice(2);
}
function gstCurMonth() {
  const ms = gstMonths();
  if (!gstMonth || !ms.includes(gstMonth)) {
    const want = gstLastMonthLabel();
    if (ms.includes(want)) gstMonth = want;
    else {
      const past = ms.filter(m => gstMonthKey(m) <= gstMonthKey(want));
      gstMonth = past.length ? past[past.length - 1] : ms[0];
    }
  }
  return gstMonth;
}
/* Read a client's record for the selected period. Untouched clients get a transient blank
   (never stored) — otherwise simply opening a new period would write a row for all 165. */
function gstRec(k) {
  const m = gstCurMonth(), id = k + "|" + m;
  return (state.gstRows || []).find(x => x && x.id === id && !x.deleted)
    || { id, k, m, s: 0, sd: "", g1: "NS", pt: 0, ptd: "", b3: "PEND", rem: "", rem1: "", mt: 0 };
}
/* Write path: the same record, materialised in state so the edit persists and syncs. */
function gstRecW(k) {
  const m = gstCurMonth(), id = k + "|" + m;
  if (!Array.isArray(state.gstRows)) state.gstRows = [];
  let r = state.gstRows.find(x => x && x.id === id && !x.deleted);

function gstAddClient() {

  gstPrompt("Add a GST client", [
    { label: "Client name", value: "" },
    { label: "GSTIN", value: "", placeholder: "15-character GSTIN" },
    { label: "Type", value: "M", options: [["M", "M \u2014 Monthly"], ["Q", "Q \u2014 Quarterly (QRMP)"]] },
    { label: "Contact person", value: "" },
    { label: "Mobile", value: "", placeholder: "10-digit number \u2014 becomes the WhatsApp number" }
  ], vals => {
    const n = String(vals[0] || "").trim().toUpperCase();
    const gstin = String(vals[1] || "").toUpperCase().replace(/\s/g, "");
    if (!n) return "The client needs a name.";
    if (!gstin) return "The GSTIN is needed \u2014 it is what the list files the client under.";
    if (!/^\d{2}[A-Z]{5}\d{4}[A-Z]\d[A-Z0-9][A-Z0-9]$/.test(gstin)) return "That is not a valid 15-character GSTIN.";
    if (!String(vals[3] || "").trim()) return "The contact person is needed.";
    const k = gstin;
    if (gstLive().some(c => c.k === k || c.n === n)) return n + " is already on the GST list.";
    const ph = String(vals[4] || "").trim();
    const digits = ph.replace(/[^0-9]/g, "");
    if (!/^\d{10}$/.test(digits.length > 10 ? (digits.match(/\d{10}/) || [""])[0] : digits) || digits.length < 10)
      return "A full 10-digit mobile number is needed.";

      wa: (ph.replace(/[^0-9]/g, "").match(/\d{10}/) || [])[0] || "",
      src: "", gst: gstin, un: "", pw: "",
      p: gstIsAdmin() ? "" : gstUser(), mq: vals[2] === "Q" ? "Q" : "M", mt: Date.now() });
    save(); rerenderMain();
  });

function gstEdit(k, field) {
  const c = gstById(k); if (!c || !gstCanEdit(c)) return;
  const r = gstRec(k);
  if (field === "cred") {
    gstPrompt("Portal login — " + c.n, [
      { label: "Username", value: c.un || "", id: "gu" },
      { label: "Password", value: c.pw || "", id: "gp" }
    ], vals => { c.un = String(vals[0]).trim(); c.pw = String(vals[1]).trim(); c.mt = Date.now(); save(); rerenderMain(); });
    return;
  }
  if (field === "gst") {
    gstPrompt("GSTIN — " + c.n, [{ label: "GST number", value: c.gst || "", id: "gg" }], vals => {
      const g = String(vals[0] || "").toUpperCase().replace(/\s/g, "");
      if (g && !/^\d{2}[A-Z]{5}\d{4}[A-Z]\d[A-Z0-9][A-Z0-9]$/.test(g)) return "That is not a valid 15-character GSTIN.";
      c.gst = g; c.mt = Date.now(); save(); rerenderMain();
    });
    return;
  }
  if (field === "ph") {
    gstPrompt("Mobile — " + c.n, [{ label: "Number (a 10-digit number here becomes the WhatsApp number)", value: c.ph || "", id: "gph" }], vals => {
      c.ph = String(vals[0] || "").trim();
      c.wa = (String(vals[0] || "").match(/\d{10}/) || [])[0] || "";
      c.mt = Date.now(); save(); rerenderMain();
    });
    return;
  }
  if (field === "src") {
    gstPrompt("Data source — " + c.n, [{ label: "Where the data comes from (Tally, Excel, portal, books with client...)", value: c.src || "", id: "gsrc" }], vals => {
      c.src = String(vals[0] || "").trim(); c.mt = Date.now(); save(); rerenderMain();
    });
    return;
  }
  if (field === "cp") {
    gstPrompt("Contact person — " + c.n, [{ label: "Name", value: c.cp || "", id: "gcp" }], vals => {
      c.cp = String(vals[0] || "").trim(); c.mt = Date.now(); save(); rerenderMain();
    });
  }
}

let _gstDlgSave = null;

    + fields.map((f, i) => '<div class="gst-fld' + (f.options ? " half" : "") + '"><label>' + escapeHTML(f.label) + "</label>"
        + (f.options

                + (String(o[0]) === String(f.value) ? " selected" : "") + ">" + escapeHTML(o[1]) + "</option>").join("") + "</select>"

        + "</div>").join("")

/* Adding a period picks the month and year from two lists, so there is no format to get

function gstAddMonth() {
  if (!gstIsAdmin()) return;
  const ms = gstMonths();
  let next = gstNextMonthLabel(ms[ms.length - 1]);
  while (ms.includes(next)) next = gstNextMonthLabel(next);
  const [nMo, nYr] = next.split(" ");
  const y0 = Number(nYr);
  const years = [];
  for (let y = y0 - 1; y <= y0 + 2; y++) { const s = String(y).padStart(2, "0"); years.push([s, "20" + s]); }
  gstPrompt("Add a period", [
    { label: "Month", value: nMo, options: GST_MSEQ.map(m => [m, GST_MFULL[m]]) },
    { label: "Year", value: nYr, options: years }
  ], vals => {
    const label = String(vals[0]) + " " + String(vals[1]);
    if (gstMonths().includes(label)) return gstPeriodFull(label) + " is already on the list.";
    const p = gstPeriodRec(label);
    const back = p.del && gstPeriodFilled(label);
    p.del = 0; p.mt = Date.now();
    gstMonth = label; gstOpen.clear(); save(); rerenderMain();
    gstAlert(gstPeriodFull(label) + (back ? " is back, with everything recorded in it before." : " added."));
  });
}

  const filled = gstPeriodFilled(m);
  const body = filled
    ? filled + (filled === 1 ? " client has" : " clients have") + " progress recorded here. It is kept, not erased — add the period again and it all comes back."
    : "Nothing has been recorded for this period yet.";
  gstConfirm("Remove " + gstPeriodFull(m) + "?", body, () => {
    const p = gstPeriodRec(m); p.del = 1; p.mt = Date.now();

}

    if (!/^\d{10}$/.test(digits.length > 10 ? (digits.match(/\d{10}/) || [""])[0] : digits) || digits.length < 10)
      return "A full 10-digit mobile number is needed.";
    state.tdsClients = state.tdsClients || [];
    state.tdsClients.push({ id: k, k, n, tan, form: vals[2],
                            p: tdsIsAdmin() ? "" : tdsUser(), rem: "", ph,
                            wa: (ph.replace(/[^0-9]/g, "").match(/\d{10}/) || [])[0] || "",
                            tu: "", tp: "", iu: "", ip: "", mt: Date.now() });
    save(); rerenderMain();
  });
}

/* ---- filters & sorting ---- */
function tdsFOn(field, v) { const a = tdsF[field] || []; return !a.length || a.includes(v); }
function tdsFToggle(field, ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  tdsFOpen = tdsFOpen === field ? "" : field;
  rerenderMain();
}
function tdsFPick(field, val, on) {
  const a = tdsF[field] || (tdsF[field] = []);
  const i = a.indexOf(val);
  if (on && i < 0) a.push(val);
  if (!on && i >= 0) a.splice(i, 1);
  rerenderMain();
}
function tdsFAll(field) { tdsF[field] = []; rerenderMain(); }
function tdsAnyFilter() {
  return !!(tdsF.q || tdsF.rem || tdsF.__stat)
    || ["person","form","d","p","rd","rf","f16"].some(f => (tdsF[f] || []).length);
}
function tdsClearFilters() {
  tdsF = { q: "", person: [], form: [], d: [], p: [], rd: [], rf: [], f16: [], rem: "" };
  tdsFOpen = "";
  rerenderMain();
}
function tdsSetFilter(field, v) {
  tdsF[field] = v;
  rerenderMain();
  const el = document.getElementById(field === "q" ? "tds-f-q" : "tds-f-rem");
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
function tdsSetSort(col) {
  tdsSort = { col, dir: (tdsSort.col === col && tdsSort.dir === "asc") ? "desc" : "asc" };
  rerenderMain();
}
function tdsSortArrow(col) {
  if (tdsSort.col !== col) return "";
  return '<span class="sa" style="width:auto;opacity:1">' + (tdsSort.dir === "desc" ? "&#9660;" : "&#9650;") + "</span>";
}
function tdsStatOn(key) { return tdsF.__stat === key; }
function tdsStatClick(key) {
  tdsF.__stat = tdsF.__stat === key ? "" : key;
  rerenderMain();
}
function tdsScopeKeys() {
  const u = tdsUser();
  let list = tdsLive();
  if (!tdsIsAdmin()) return list.filter(c => c.p === u);
  return tdsScope === "mine" ? list.filter(c => c.p === u) : list;
}
function tdsVisible() {
  let list = tdsScopeKeys();
  const q = String(tdsF.q || "").toLowerCase().trim();
  if (q) list = list.filter(c => (c.n || "").toLowerCase().includes(q) || (c.tan || "").toLowerCase().includes(q));
  list = list.filter(c => tdsFOn("person", c.p || "__none") && tdsFOn("form", c.form || ""));
  list = list.filter(c => {
    const r = tdsRec(c.k), qr = tdsQRec(c.k);
    return tdsFOn("d", r.d) && tdsFOn("p", r.p)
      && tdsFOn("rd", qr.rd) && tdsFOn("rf", qr.rf) && tdsFOn("f16", qr.f16);
  });
  if (tdsF.rem) { const rq = tdsF.rem.toLowerCase(); list = list.filter(c => (c.rem || "").toLowerCase().includes(rq)); }
  if (tdsF.__stat) list = list.filter(c => {
    const p = tdsRec(c.k).p;
    if (tdsF.__stat === "paid") return p === "PAID";
    if (tdsF.__stat === "cp") return p === "CP";
    if (tdsF.__stat === "na") return p === "NA";
    if (tdsF.__stat === "pend") return p !== "PAID" && p !== "CP" && p !== "NA";
    if (tdsF.__stat === "d") return tdsRec(c.k).d === "RECD";
    if (tdsF.__stat === "filed") return tdsQRec(c.k).rf === "F";
    return true;
  });
  const ORD = (arr, v) => { const i = arr.findIndex(x => x[0] === v); return i < 0 ? 0 : i; };
  const val = c => {
    switch (tdsSort.col) {
      case "person": return String(displayName(c.p) || "~~~").toLowerCase();
      case "form": return c.form || "";
      case "d":   return ORD(TDS_D, tdsRec(c.k).d);
      case "p":   return ORD(TDS_P, tdsRec(c.k).p);
      case "rd":  return ORD(TDS_RD, tdsQRec(c.k).rd);
      case "rf":  return ORD(TDS_RF, tdsQRec(c.k).rf);
      case "f16": return ORD(TDS_F16, tdsQRec(c.k).f16);
      case "rem": return (c.rem || "").toLowerCase();
      default:    return (c.n || "").toLowerCase();
    }
  };
  list.sort((a, b) => {
    const x = val(a), y = val(b);
    const r = x < y ? -1 : x > y ? 1 : (a.n || "").localeCompare(b.n || "");
    return tdsSort.dir === "desc" ? -r : r;
  });
  return list;
}

/* ---- backlog ----
   The same red badge the GST tab wears: work left behind in earlier periods, counted and
   listed on hover, so a clean-looking month cannot hide an unpaid April. */

function tdsRowFor(k, m) {
  return (state.tdsRows || []).find(r => r && !r.deleted && r.k === k && r.m === m) || tdsBlank(k, m);
}
function tdsPastOutstanding(k, side) {
  const cur = tdsKey(tdsCurMonth());
  const out = [];
  tdsMonths().forEach(id => {
    const key = tdsKey(id);
    if (key >= cur) return;
    const mo = tdsMeta(id), r = tdsRowFor(k, id);
    const items = [];
    if (side === "pay") {
      /* Received and No-data are settled; At-qtr-end only turns late once its own
         quarter-end month is also behind us. */
      if (r.d === "PEND" || r.d === "REQ" || (r.d === "QEND" && tdsKey(mo.qEndId) < cur)) items.push("data");
      if (r.p === "PEND" || r.p === "IP" || r.p === "OH") items.push("payment");
      if (items.length) out.push(mo.label + (mo.y !== tdsMeta(tdsCurMonth()).y ? " " + mo.y % 100 : "") + ": " + items.join(" + "));
    } else if (mo.qEnd) {
      if (r.rd === "PEND") items.push("return data");
      if (r.rf === "PEND" || r.rf === "IP") items.push("return not filed");
      if (items.length) out.push(mo.q + " FY" + mo.fy % 100 + ": " + items.join(" + "));
    }
  });
  return out;
}
function tdsWarnDot(k, side) {
  const late = tdsPastOutstanding(k, side);
  if (!late.length) return "";
  return '<span class="gst-warn" title="' + escapeAttr("Still pending from earlier \u2014 " + late.join(" \u00b7 ")) + '">' + late.length + "</span>";
}

/* ---- cells ---- */
function tdsSel(c, field, opts, cur, tip) {
  if (!tdsCanEdit(c)) return '<span class="gst-ro" title="' + escapeAttr(tip || "") + '">' + TDS_MAP(opts)[cur] + "</span>";
  return '<select class="gst-sel" title="' + escapeAttr(tip || "") + '" onchange="tdsSetField(\'' + escapeAttr(c.k) + '\',\'' + field + '\',this.value)">'
    + opts.map(x => '<option value="' + x[0] + '"' + (cur === x[0] ? " selected" : "") + ">" + x[1] + "</option>").join("")
    + "</select>";
}
function tdsRemCell(c) {
  if (!tdsCanEdit(c)) {
    return '<div class="gst-remview">' + (c.rem ? escapeHTML(c.rem) : '<span style="color:var(--n300)">&mdash;</span>') + "</div>";
  }
  return '<textarea class="gst-rem" rows="1" placeholder="Add remark…"'
    + ' onfocus="gstRemGrow(this)" oninput="gstRemGrow(this)" onblur="gstRemBlur(this)"'
    + ' onchange="tdsSetRem(\'' + escapeAttr(c.k) + '\',this.value)">' + escapeHTML(c.rem || "") + "</textarea>";
}

/* ---- view ---- */

    + stat("cp", cp, "Client paying", n, tdsStatOn("cp"))
    + stat("pend", pend, "Payment pending", n, tdsStatOn("pend"))
    + stat("na", na, "No TDS / NA", n, tdsStatOn("na"))

  const monthSel = '<select class="gst-monthsel" onchange="tdsSetMonth(this.value)">'

    + "</select>"
    + (tdsIsAdmin()
        ? ' <button class="add-task-btn" onclick="tdsAddMonth()" title="Add the next month">' + icon("plus", 12) + "</button>"

  const mineN = tdsLive().filter(c => c.p === u).length;

      + `<button class="af-rtab${tdsScope === "mine" ? " on" : ""}" onclick="tdsSetScope('mine')">Mine <span class="af-cnt">${mineN}</span></button></div>`
    : `<div class="af-roletabs"><span class="af-rtab on" style="cursor:default">My clients <span class="af-cnt">${mineN}</span></span></div>`;

  const people = allAssignees();

  const formOpts = [...new Set(tdsLive().map(c => c.form).filter(Boolean))].sort().map(f => [f, f]);

  /* same checkbox-filter cell as the GST tab, wired to tds state */

      + (open ? '<div class="gst-cf-menu" onclick="event.stopPropagation()">'
          + '<label class="gst-cf-opt all"><input type="checkbox"' + (cur.length ? "" : " checked")
            + ' onchange="tdsFAll(\'' + field + '\')">All</label>'
          + (opts.length ? opts.map(o => '<label class="gst-cf-opt"><input type="checkbox"' + (cur.includes(o[0]) ? " checked" : "")
              + ' onchange="tdsFPick(\'' + field + '\',\'' + escapeAttr(o[0]) + '\',this.checked)">' + escapeHTML(o[1]) + "</label>").join("")
             : '<div class="gst-cf-none">Nothing to filter on</div>')
          + "</div>" : "")
      + "</div>";
  };

  const filterRow = '<tr class="filter-row">'
    + '<td><button class="af-cf-x" onclick="tdsClearFilters()" title="Clear filters">' + icon("x", 12) + "</button></td>"
    + '<td><input id="tds-f-q" type="text" value="' + escapeAttr(tdsF.q) + '" placeholder="Search client / TAN…" oninput="tdsSetFilter(\'q\',this.value)"></td>'

    + "<td>" + chk("p", "TDS payment", TDS_P) + "</td>"
    + (qEnd
        ? "<td>" + chk("rd", "return data", TDS_RD) + "</td>"
          + "<td>" + chk("rf", "return filing", TDS_RF) + "</td>"

        : "")
    + '<td><input id="tds-f-rem" type="text" value="' + escapeAttr(tdsF.rem) + '" placeholder="Search remarks…" oninput="tdsSetFilter(\'rem\',this.value)"></td>'
    + "<td></td></tr>";

  const body = rows.length === 0
    ? '<tr><td colspan="' + cols + '"><div class="af-empty">' + (tdsLive().length === 0
        ? "No TDS clients yet."

          ? '<td><select class="gst-sel" style="max-width:110px" onchange="tdsSetPerson(\'' + escapeAttr(c.k) + '\',this.value)">'

          + '<span class="gst-ditem"><span class="gst-dlbl">TAN</span>' + dv(c.tan, 'tan', 'No TAN', 'TAN') + cpy(c.tan, 'TAN') + '</span>'

            + '<span style="color:var(--n300)">/</span>' + dv(c.tp, 'traces', 'No password', 'TRACES password') + cpy(c.tp, 'password') + '</span>'
          + '<span class="gst-ditem"><span class="gst-dlbl">e-filing</span>' + dv(c.iu, 'itr', 'No user', 'Income-tax e-filing user ID') + cpy(c.iu, 'user ID')
            + '<span style="color:var(--n300)">/</span>' + dv(c.ip, 'itr', 'No password', 'e-filing password') + cpy(c.ip, 'password') + '</span>'
          + '<span class="gst-ditem"><span class="gst-dlbl">Form</span>' + dv(c.form, 'form', 'Not set', 'TDS return form') + '</span>'

                ? '<select class="' + cls + '" onclick="event.stopPropagation()"'
                  + ' onchange="tdsSetAct(\'' + escapeAttr(c.k) + '\',this.value)"'
                  + ' title="Whether this client is worked on">'
                  + ACT_OPTS.map(a => '<option value="' + a[0] + '"' + ((c.act || "A") === a[0] ? " selected" : "") + ">" + a[1] + "</option>").join("")
                  + "</select>"
                : '<span class="' + cls + ' ro">' + ACT_LBL[c.act || "A"] + "</span>";
            })() + '</span>'
          + "</div></td></tr>" : "";
        return `<tr class="gst-main${inactive ? " off" : ""}" onclick="tdsRowClick(event,'${escapeAttr(c.k)}')">`
          + `<td class="af-sr">${i + 1}</td>`
          + `<td><span class="af-cname gst-cname">${icon(open ? "chevron-down" : "chevron-right", 12)}${escapeHTML(c.n)}`
            + (inactive ? `<span class="act-tag">${escapeHTML(ACT_LBL[c.act])}</span>` : "")
            + (c.wa
                ? '<button type="button" class="gcx-wa" onclick="event.stopPropagation();openWhatsApp(\'91' + escapeAttr(c.wa) + '\',\'\')"'
                  + ' title="' + escapeAttr("WhatsApp " + c.n + " on " + c.ph) + '" aria-label="WhatsApp this client">'
                  + icon("message-circle", 14) + "</button>"
                : "")
            + "</span></td>"
          + personCell
          + `<td><span class="af-ttag ${c.form === "24Q" ? "fin" : "acc"}" title="Form ${escapeHTML(c.form || "?")}">${escapeHTML(c.form || "?")}</span></td>`
          + '<td class="gst-sep">' + tdsSel(c, "d", TDS_D, r.d, "Data for " + mo.full) + "</td>"
          + '<td style="white-space:nowrap">' + tdsSel(c, "p", TDS_P, r.p, "TDS payment — due " + mo.payBy) + tdsWarnDot(c.k, "pay") + (qEnd ? "" : tdsWarnDot(c.k, "ret")) + "</td>"
          + (qEnd
              ? '<td class="gst-sep">' + tdsSel(c, "rd", TDS_RD, qr.rd, mo.q + " return data") + "</td>"
                + '<td style="white-space:nowrap">' + tdsSel(c, "rf", TDS_RF, qr.rf, mo.q + " return — file by " + mo.fileBy) + tdsWarnDot(c.k, "ret") + "</td>"
                + "<td>" + tdsSel(c, "f16", TDS_F16, qr.f16, "Form 16 / 16A for " + mo.q) + "</td>"

          + (tdsIsAdmin()
              ? '<td style="text-align:center"><button type="button" class="gcx-del"'

                + ' title="' + escapeAttr('Remove ' + c.n + ' from the TDS module') + '" aria-label="Remove this client">'
                + icon('trash', 13) + "</button></td>"
              : "<td></td>")
          + "</tr>" + detail;
      }).join("");

  const note = qEnd
    ? mo.q + " return files by " + mo.fileBy + " · challan for " + mo.label + " by " + mo.payBy + "."
    : "Challan for " + mo.label + " is due by " + mo.payBy + ".";

  return '<div class="card af-mod mod-fill">'
    + '<div class="af-modhead"><div class="af-modtitle">TDS<small>' + monthSel + "</small></div>" + scopeHTML + "</div>"
    + statsHTML
    + '<div class="af-tscroll gst-wide"><table><thead>' + head + filterRow + "</thead><tbody>" + body + "</tbody></table></div>"
    + `<div class="af-footbar"><b>Pujara &amp; Co.</b> &middot; ${rows.length} of ${n} client${n === 1 ? "" : "s"}`
    + ` &middot; ${escapeHTML(mo.full)} &middot; ${paid} paid &middot; ${filedN} filed`
    + `<span style="margin-left:auto">${note}</span></div></div>`;
}

function _viewBody() {
  const u = state.session && state.session.user;
  const visible = visibleTabsForUser();
  if (u && !visible.includes(state.activeTab)) state.activeTab = visible[0] || "Dashboard";
  const t = state.activeTab;
  if (t === "Dashboard") return renderDashboard();
  if (t === "Admin") return renderAdmin();
  if (t === "Admin 2") return renderAdmin2();
  if (t === "Admin 3") return renderAdmin3();
  if (t === "Emp 10") return renderHeena();       /* checked before the employee views below */
  if (t === "Super Admin") return renderSuperAdmin();
  if (t === "Acct & Final") return renderAcctFin();
  if (t === "GST") return renderGst();
  if (t === "GST-Comp") return renderGstComp();
  if (t === "TDS") return renderTds();
  if (t === "Fees") return renderFees();
  if (t === "Activity") return renderActivity();
  if (t === "Settings") return renderSettings();
  if (state.employees.includes(t)) return renderEmployeeView(t);
  if (t === "Master") { state.activeTab = "Admin"; return renderAdmin(); }
  state.activeTab = "Dashboard";
  return renderDashboard();
}
function render() {
  EMPLOYEES = state.employees;
  if (!state.session || !state.session.user) { renderGate(); return; }
  renderHeader();
  renderTabs();
  document.getElementById("main").innerHTML = viewHTML();
  fitModule();
  modScrollRestore();
}
/* ==================== COMMAND PALETTE (Ctrl/Cmd+K) ====================
   Additive UI layer — every item calls an existing action (setTab,
   _dashDrill, exportJSON, print, logout). No data or sync changes. */
let _cmdkOpen = false, _cmdkSel = 0, _cmdkFlat = [];
function _cmdkEnsureDom() {
  if (document.getElementById("cmdkOverlay")) return;
  const o = document.createElement("div");
  o.id = "cmdkOverlay";
  o.className = "cmdk-overlay";
  o.innerHTML = `
    <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="Command menu">
      <div class="cmdk-input-row">${icon('search', 16)}<input id="cmdkInput" placeholder="Search tasks, clients, actions…" autocomplete="off" spellcheck="false" /></div>
      <div class="cmdk-list" id="cmdkList"></div>
      <div class="cmdk-foot"><span><kbd class="kbd">↑↓</kbd> navigate</span><span><kbd class="kbd">Enter</kbd> open</span><span><kbd class="kbd">Esc</kbd> close</span></div>
    </div>`;
  document.body.appendChild(o);
  o.addEventListener("mousedown", (e) => { if (e.target === o) closeCmdk(); });
  const inp = document.getElementById("cmdkInput");
  inp.addEventListener("input", () => { _cmdkSel = 0; _cmdkRenderList(); });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); _cmdkSel = Math.min(_cmdkFlat.length - 1, _cmdkSel + 1); _cmdkRenderList(true); }
    else if (e.key === "ArrowUp") { e.preventDefault(); _cmdkSel = Math.max(0, _cmdkSel - 1); _cmdkRenderList(true); }
    else if (e.key === "Enter") { e.preventDefault(); _cmdkRun(_cmdkSel); }
    else if (e.key === "Escape") { e.preventDefault(); closeCmdk(); }
  });
}
/* The creation form is now an inline row inside the first task table — so this action must
   also unfold that section and open the row before it can focus anything. */
function _cmdkGoAddTask() {
  const u = state.session && state.session.user;
  if (!u) return;
  setTab(u);
  const map = { "Super Admin": ["super", "supNew"], "Admin": ["admin", "new"], "Admin 2": ["admin2", "ad2New"], "Admin 3": ["admin3", "ad3New"] };
  const m = map[u];
  const scope = m ? m[0] + "_mine" : "emp:" + u + "_active";
  const idPrefix = m ? m[1] : "empNew";
  if (m) sectionFold[_foldKey(m[0], "mine")] = false;
  inlineAddOpen[scope] = true;
  rerenderMain();
  setTimeout(() => {
    const el = document.getElementById(idPrefix + "Task");
    if (el) { el.scrollIntoView({ block: "center" }); el.focus(); }
  }, 60);
}
function _cmdkItems(q) {
  const u = state.session && state.session.user;
  if (!u) return [];
  const query = String(q || "").trim().toLowerCase();
  const items = [];
  visibleTabsForUser().forEach(t => {
    const isPersonal = ADMINS.includes(t) || EMPLOYEES.includes(t);
    const label = "Go to " + (isPersonal ? displayName(t) + " — workspace" : t);
    items.push({ group: "Navigate", icon: "chevron-right", label, run: () => setTab(t) });
  });
  items.push({ group: "Actions", icon: "plus", label: "Add new task", run: _cmdkGoAddTask });
  items.push({ group: "Actions", icon: "folder", label: "Toggle Office Sheets", run: toggleOfficeSheets });
  items.push({ group: "Actions", icon: "download", label: "Download backup (JSON)", run: exportJSON });
  items.push({ group: "Actions", icon: "printer", label: "Print current view", run: () => window.print() });
  items.push({ group: "Actions", icon: "log-out", label: "Log out", run: logout });
  /* visibleTasks() is already role-scoped — employees only see their own tasks here */
  const tasks = visibleTasks().map(t => ({
    group: "Tasks", icon: "clipboard-list",
    label: (t.task || "(untitled)") + " · " + (t.client || "—"),
    sub: t.status + " · " + displayName(t.assignee),
    run: () => _dashDrill({ focusId: t.id })
  }));
  const clients = (state.clients || []).map(c => ({
    group: "Clients", icon: "building", label: c, sub: "filter tasks",
    run: () => _dashDrill({ client: c })
  }));
  if (!query) return items.concat(tasks.slice(0, 6)).concat(clients.slice(0, 4));
  const match = (i) => i.label.toLowerCase().includes(query) || (i.sub || "").toLowerCase().includes(query);
  return items.filter(match).concat(tasks.filter(match).slice(0, 20)).concat(clients.filter(match).slice(0, 10));
}
function _cmdkRenderList(keepScroll) {
  const list = document.getElementById("cmdkList");
  const inp = document.getElementById("cmdkInput");
  if (!list || !inp) return;
  _cmdkFlat = _cmdkItems(inp.value);
  if (_cmdkSel >= _cmdkFlat.length) _cmdkSel = Math.max(0, _cmdkFlat.length - 1);
  if (_cmdkFlat.length === 0) { list.innerHTML = '<div class="cmdk-empty">No matches. Try a task, client, or action name.</div>'; return; }
  let html = "", lastGroup = null;
  _cmdkFlat.forEach((it, i) => {
    if (it.group !== lastGroup) { html += `<div class="cmdk-group">${escapeHTML(it.group)}</div>`; lastGroup = it.group; }
    html += `<div class="cmdk-item ${i === _cmdkSel ? 'sel' : ''}" data-cmdk-i="${i}" onmousemove="if(_cmdkSel!==${i}){_cmdkSel=${i};_cmdkRenderList(true);}" onclick="_cmdkRun(${i})">
      ${icon(it.icon || 'chevron-right')}<span class="cmdk-label">${escapeHTML(it.label)}</span>${it.sub ? `<span class="cmdk-sub">${escapeHTML(it.sub)}</span>` : ''}
    </div>`;
  });
  list.innerHTML = html;
  const sel = list.querySelector(".cmdk-item.sel");
  if (sel && !keepScroll) sel.scrollIntoView({ block: "nearest" });
  else if (sel) sel.scrollIntoView({ block: "nearest" });
}
function _cmdkRun(i) {
  const it = _cmdkFlat[i];
  if (!it) return;
  closeCmdk();
  setTimeout(() => it.run(), 10);
}
function openCmdk() {
  if (!state.session || !state.session.user) return;
  _cmdkEnsureDom();
  _cmdkOpen = true; _cmdkSel = 0;
  document.getElementById("cmdkOverlay").classList.add("open");
  const inp = document.getElementById("cmdkInput");
  inp.value = "";
  _cmdkRenderList();
  setTimeout(() => inp.focus(), 20);
}
function closeCmdk() {
  _cmdkOpen = false;
  const o = document.getElementById("cmdkOverlay");
  if (o) o.classList.remove("open");
}
document.addEventListener("keydown", function (e) {
  /* Alt+F opens the client search (advertised on the badge). Ctrl+F stays with the
     browser's own Find. */
  if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === "f" || e.key === "F")) {
    const inp = document.getElementById("superSearchInp");
    e.preventDefault();
    if (_cmdkOpen) closeCmdk();
    if (inp) focusSuperSearch(); else openCmdk();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "k" || e.key === "K")) {
    e.preventDefault();
    if (_cmdkOpen) closeCmdk(); else openCmdk();
  }
});

/* Global filter reset — clears every column filter, activity filter, fees filter and focus on all tabs */
function resetAllFilters(btn) {
  colFilters = {};
  colSort = {};
  actFilter = { by: "", action: "", from: "", to: "" };
  if (typeof feesFilter === "object") {
    feesFilter = { category: 'GST Annual', status: 'all', search: '' };
  }
  focusId = null;
  const inp = document.getElementById('superSearchInp');
  if (inp) inp.value = "";
  rerenderMain();
  if (btn) {
    btn.classList.add("hdr-reset-done");
    setTimeout(() => btn.classList.remove("hdr-reset-done"), 800);
  }
}

/* ==================== CLOUD-ONLY SYNC ==================== */
const _CLOUD_TOKEN_KEY = "pujara_co_cloud_token";
function cloudToken() { try { return localStorage.getItem(_CLOUD_TOKEN_KEY); } catch (e) { return null; } }
function setCloudToken(t) { try { if (t) localStorage.setItem(_CLOUD_TOKEN_KEY, t); else localStorage.removeItem(_CLOUD_TOKEN_KEY); } catch (e) {} }

async function cloudLogin(cred) {
  /* cred: { mpin } or { mobile } — the server checks MPIN first */
  try {
    const res = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cred) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return { ok: false, error: data.error || ("Login failed (" + res.status + ")") };
    setCloudToken(data.token);
    return { ok: true, user: data.user };
  } catch (e) { return { ok: false, error: "Network error. Check internet connection." }; }
}
const CLIENT_VERSION = "2026-08-15-v117";
let _versionReloadPending = false;
function _checkVersion(serverVersion) {
  if (!serverVersion || serverVersion === CLIENT_VERSION) return;
  if (_versionReloadPending) return;
  _versionReloadPending = true;
  (function tryReload() {
    if (_localDirty || _cloudSaveBusy || _cloudSavePending || _hasActiveUserInteraction()) {
      setTimeout(tryReload, 4000);
      return;
    }
    location.reload();
  })();
}
let _lastRev = null;   /* revision of the cloud state we currently hold; lets idle polls short-circuit */
async function cloudFetchState() {
  const token = cloudToken();
  if (!token) return { ok: false, expired: false };
  try {
    const headers = { "Authorization": "Bearer " + token };
    if (_lastRev) headers["If-None-Match"] = _lastRev;   /* server returns a tiny "unchanged" if this still matches */
    const res = await fetch("/api/state", { headers, cache: "no-store" });
    if (res.status === 401) { setCloudToken(null); return { ok: false, expired: true }; }
    if (!res.ok) return { ok: false, expired: false };
    const data = await res.json();
    _checkVersion(data && data.version);
    if (typeof _markSynced === 'function') _markSynced();
    if (data && data.rev) _lastRev = data.rev;
    if (data && data.unchanged) return { ok: true, unchanged: true };
    return { ok: true, state: data.state };
  } catch (e) { return { ok: false, expired: false }; }
}
let _cloudSaveTimer = null, _cloudSaveBusy = false, _cloudSavePending = false;
let _localDirty = false;  /* true when local has changes not yet confirmed saved to cloud */
let _savedTickTimer = null;
function _showSaved() {
  const dot = document.getElementById('syncIndicator');
  if (!dot) return;
  dot.classList.add('saved');
  clearTimeout(_savedTickTimer);
  _savedTickTimer = setTimeout(() => { dot.classList.remove('saved'); _updateSyncIndicator(); }, 1300);
}
function scheduleCloudSave() {
  if (!cloudToken()) return;
  if (_cloudSaveBusy) { _cloudSavePending = true; return; }
  clearTimeout(_cloudSaveTimer);
  _cloudSaveTimer = setTimeout(async () => {
    _cloudSaveBusy = true; _cloudSavePending = false;
    /* Optimistically clear dirty — if a new edit lands during the POST, save() re-sets it */
    _localDirty = false;
    let okSaved = false;
    try {
      const res = await fetch("/api/state", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cloudToken() }, body: JSON.stringify({ state }) });
      if (res.status === 401) { _cloudSaveBusy = false; setCloudToken(null); alert("Your session expired. Please log in again."); logout(); return; }
      okSaved = res.ok;
      if (okSaved) {
        _showSaved();
        /* Server returns the MERGED state (our changes + anyone else's concurrent changes).
           Adopt it so this device immediately reflects the true cloud state — but only if
           the user isn't mid-edit, and only if there were no edits during the POST. */
        try {
          const data = await res.json();
          _checkVersion(data && data.version);
          if (typeof _markSynced === 'function') _markSynced();
          const _msPopupOpen = (typeof _msOpen === 'object') && Object.keys(_msOpen).some(k => _msOpen[k]);
          if (data && data.state && !_localDirty && !_hasActiveUserInteraction() && !_msPopupOpen) {
            const cu = state.session && state.session.user;
            const ct = state.activeTab;
            state = migrate(data.state);
            if (cu) state.session = { user: cu };
            if (ct) state.activeTab = ct;
            EMPLOYEES = state.employees;
            rerenderMain();
            /* We adopted the server's merged state, so this rev is now truly ours — next poll short-circuits.
               Only set it here (inside the adopt branch): if we skipped adoption (mid-edit) we must NOT
               claim the rev, or the next poll could short-circuit past a concurrent change we never applied. */
            if (data.rev) _lastRev = data.rev;
          }
        } catch (e) {}
      }
    } catch (e) { okSaved = false; }
    _cloudSaveBusy = false;
    if (!okSaved) {
      /* Save failed — keep changes marked dirty and retry shortly. NEVER let a poll discard them. */
      _localDirty = true;
      setTimeout(scheduleCloudSave, 2500);
    } else if (_cloudSavePending) {
      scheduleCloudSave();
    }
  }, 400);
}

/* Wrap save() to also push to cloud silently */
const _origSave = save;
save = function() { _localDirty = true; _origSave(); scheduleCloudSave(); };
/* Wrap logout to clear cloud token — but FIRST flush any pending edit to the cloud.
   The debounced save needs the token; clearing it immediately meant a change made
   moments before logging out never left this browser. keepalive lets the request
   complete even as the page re-renders to the sign-in gate. */
const _origLogout = logout;
logout = async function() {
  try {
    const tok = cloudToken();
    if (tok && (_localDirty || _cloudSaveTimer)) {
      clearTimeout(_cloudSaveTimer); _cloudSaveTimer = null;
      _localDirty = false;
      /* Await the flush: the page stays open during a logout (SPA re-render, no
         navigation), and keepalive can't be used — its 64KB body cap is far below
         the office state's size, so the request would be silently dropped. */
      await fetch("/api/state", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tok },
        body: JSON.stringify({ state })
      }).catch(() => {});
    }
  } catch (e) {}
  setCloudToken(null);
  _origLogout();
};
/* Wrap attemptLogin to use cloud */
const _origAttemptLogin = attemptLogin;
attemptLogin = async function() {
  const pin = _normalizeMpin(String(_gateRawCred() || "").trim());
  if (!pin) { gateError = "Enter your full 4-digit MPIN."; renderGate(); return; }
  const result = await cloudLogin({ mpin: pin });
  if (!result.ok) { gateError = result.error || "Login failed"; renderGate(); return; }
  state.session = { user: result.user };
  const fetched = await cloudFetchState();
  if (fetched.ok && fetched.state) {
    state = migrate(fetched.state);
    state.session = { user: result.user };
    EMPLOYEES = state.employees;
  }
  if (result.user === "Super Admin") state.activeTab = "Super Admin";
  else if (ADMINS.includes(result.user)) state.activeTab = result.user;
  else state.activeTab = result.user;
  gateError = "";
  _origSave(); render();
};

/* Pull fresh cloud state; replace local if different and user isn't actively editing */
let _lastUserActivity = 0;
function _markActivity() { _lastUserActivity = Date.now(); }
/* Mark activity on every save (user edited something) */
const _saveWithActivity = save;
save = function() { _markActivity(); _saveWithActivity(); };
function _hasActiveUserInteraction() {
  /* Don't yank state if user is actively interacting with the page */
  /* 1. Any add-task form field has a value (task select, client combo, remarks, etc.) */
  const formIds = ['newTask','newClient','newRemarks','supNewTask','supNewClient','supNewRemarks','ad2NewTask','ad2NewClient','ad2NewRemarks','ad3NewTask','ad3NewClient','ad3NewRemarks','empNewTask','empNewClient','empNewRemarks'];
  for (const id of formIds) {
    const el = document.getElementById(id);
    if (el && typeof el.value === 'string' && el.value.trim() !== '' && el.value !== '__OTHER__') {
      /* Also skip if value is just a default empty option */
      return true;
    }
    if (el && el.value === '__OTHER__') return true;   /* user is in middle of specifying Other */
  }
  /* 1b. Any "Add another client" extra row has a value — don't wipe a multi-client entry mid-way */
  const extras = document.querySelectorAll('.extra-client-row input[data-combo-id]');
  for (const inp of extras) { if (inp && typeof inp.value === 'string' && inp.value.trim() !== '') return true; }
  /* 2. Active focus is on a form field, input, select, or contenteditable cell */
  const ae = document.activeElement;
  if (ae && ae !== document.body) {
    const tag = (ae.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
    /* Note on 'select': inline status/assignee cell selects retain focus after onchange,
       which would block sync forever. updateField() explicitly blurs them after save to
       prevent that, so polling resumes immediately on those changes. Form selects in the
       Add-Task form remain protected because user keeps focus while picking. */
    if (ae.getAttribute && ae.getAttribute('contenteditable') === 'true') return true;
  }
  /* 3. A combobox dropdown is currently open (user picking suggestions) */
  const dd = document.querySelectorAll('.combo-dropdown');
  for (const d of dd) { if (d.style && d.style.display !== 'none' && d.style.display !== '') return true; }
  /* 4. Inline mobile popover is open (user adding new client) */
  if (document.querySelector('.mobile-inline')) return true;
  /* 5. An "Other" inline input is visible (user typing one-off task name) */
  const others = document.querySelectorAll('[id$="-other"]');
  for (const o of others) { if (o.style && (o.style.display === 'block' || o.style.display === 'flex')) return true; }
  return false;
}
async function _pullCloudAndApply() {
  if (!cloudToken()) return;
  if (Date.now() - _lastUserActivity < 2000) return;   /* don't yank state right after a user action */
  if (typeof _msOpen === 'object' && Object.keys(_msOpen).some(k => _msOpen[k])) return; /* don't disrupt an open multi-select popup */
  if (_cloudSaveBusy || _cloudSavePending) return;     /* don't fight a pending save */
  if (state.session && !state.session.user) return;    /* not signed in */
  if (_hasActiveUserInteraction()) return;             /* don't disrupt active form/edit/popover */
  if (_localDirty) { scheduleCloudSave(); return; }    /* local has unsaved changes — push, never discard */
  const fetched = await cloudFetchState();
  if (fetched.expired) { renderGate(); return; }
  if (!fetched.ok || !fetched.state) return;
  /* Compare LIKE FOR LIKE, or this never matches and every poll rebuilds every table.
     Two things used to break it: (1) the local side had been through migrate() (which
     normalises t.mt, stringifies ids, drops old tombstones, backfills dates) while the cloud
     side was raw, and (2) activeTab is a per-user UI field that is nevertheless persisted in
     the shared cloud state (the server merge lets the last writer win) — so as soon as anyone
     saved from a different tab, this comparison failed forever and the ~1,176 visible rows
     were re-rendered every 5 seconds. Now both sides are migrated and local-only UI fields
     are excluded, so an unchanged sync costs nothing. */
  const nextState = migrate(fetched.state);
  const _cmpKey = (s) => { const o = { ...s }; delete o.session; delete o.activeTab; return JSON.stringify(o); };
  if (_cmpKey(state) === _cmpKey(nextState)) return;
  /* Re-check active interaction RIGHT before render (race-safe) */
  if (_hasActiveUserInteraction()) return;
  const cachedUser = state.session && state.session.user;
  const cachedTab = state.activeTab;
  state = nextState;
  if (cachedUser) state.session = { user: cachedUser };
  if (cachedTab) state.activeTab = cachedTab;
  EMPLOYEES = state.employees;
  rerenderMain();
}
/* On startup: pull fresh cloud state */
(async function _cloudStartup() {
  if (!cloudToken()) return;
  const fetched = await cloudFetchState();
  if (fetched.expired) { renderGate(); return; }
  if (fetched.ok && fetched.state) {
    const cachedUser = state.session && state.session.user;
    const cachedTab = state.activeTab;  /* preserve tab across cloud-startup so refresh stays on current page */
    state = migrate(fetched.state);
    if (cachedUser) state.session = { user: cachedUser };
    if (cachedTab) state.activeTab = cachedTab;
    EMPLOYEES = state.employees;
    render();
  }
})();
/* Poll while tab is visible; immediate refresh when tab becomes visible. Idle polls short-circuit
   server-side via If-None-Match, so each one costs a tiny response unless something actually changed.
   5s keeps cross-device updates near-live while staying well inside the Hobby edge-request budget.
   (Was 1500ms — a 10x mismatch with the "15s" the original comment intended, which is what ran up
   Fast Origin Transfer to 300% of the free tier and got the whole Vercel team paused.) */
setInterval(() => { if (!document.hidden) _pullCloudAndApply(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) _pullCloudAndApply(); });

render();
</script>
