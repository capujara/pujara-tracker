  /* ==================== GST Composition ====================
     The layout of the source page — a grid list with a stage colour down the left of each
     row, icon toggles for the three data pieces, a pill dropdown for the challan and a
     circular Filed switch — drawn entirely in the tracker's own tokens. Nothing here
     introduces a colour or a radius the rest of the app does not already use. */
  .gcx {
    /* the four status columns carry a label and a filter button now, so they are sized
       for both rather than for the icon alone */
    /* the client name is the identifier you scan by, so it gets the lion's share of the
       flexible width; note and remark open downwards on click and can afford less */
    --gcx-cols: 30px minmax(190px,2.15fr) 100px 100px 100px minmax(96px,0.78fr) 112px 72px minmax(92px,0.64fr) 28px;
    --gcx-await: var(--st-rc-fg);  --gcx-datain: var(--st-ip-fg); --gcx-ready: var(--st-bl-fg);
    --gcx-challan: var(--accent);  --gcx-filed: var(--success-text); --gcx-skip: var(--n300);
  }

  /* toolbar: search, stage chips, and how much of the quarter is filed */

  /* ---- how far the quarter has got ----
     The GST tab's stat cards, unchanged: same markup, same classes, same proportions, so
     the two tabs read as one app rather than two. Counts are cumulative — a client whose
     figures are worked out plainly has their data too, which exclusive buckets hid — and
     the bar under each is that step's share of the clients who actually have to file. */

  /* the list */
  .gcx-scroll { overflow:auto; overscroll-behavior:contain; }
  .gcx-head { display:grid; grid-template-columns:var(--gcx-cols); gap:8px; align-items:center; padding:9px 16px;
    background:var(--n25); border-bottom:1px solid var(--n200); position:sticky; top:0; z-index:6; min-width:1030px; }
  .gcx-head .h { font-size:10.5px; font-weight:650; letter-spacing:0.03em; color:var(--n500); text-transform:uppercase; }
  /* every heading is: a label that sorts, and where it helps, its own way to narrow */
  .gcx-head .h.gcx-hf { position:relative; display:flex; align-items:center; gap:5px; min-width:0; }
  .gcx-head .h.gcx-hf.c { justify-content:center; }
  .gcx-head .hl { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-flex; align-items:center; gap:3px; }
  .gcx-head .hl.srt { cursor:pointer; user-select:none; }
  .gcx-head .hl.srt:hover { color:var(--n800); }
  /* the arrow takes no room until the column is actually the one being sorted, which
     buys back ~10px in every heading for the label and its control */
  .gcx-head .hl .sa { color:var(--accent); font-size:9px; width:0; overflow:hidden; opacity:0; }
  .gcx-head .hl.on .sa { width:auto; opacity:1; }
  .gcx-head .hl.on { color:var(--n900); }

  /* Always visible: hiding these until hover meant nobody knew a column could be searched
     or filtered. Quiet by default, darker on hover, and unmistakably on when it is filtering. */
  .gcx-fbtn { flex:none; width:21px; height:21px; border-radius:5px; display:grid; place-items:center; border:none;
    background:var(--n100); color:var(--n500); cursor:pointer;
    transition:background var(--dur-1) var(--ease), color var(--dur-1) var(--ease); }
  .gcx-head .h:hover .gcx-fbtn { background:var(--n150); color:var(--n700); }
  .gcx-fbtn:hover { background:var(--n200) !important; color:var(--n900) !important; }
  .gcx-fbtn:focus-visible { outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  .gcx-fbtn.on, .gcx-head .h:hover .gcx-fbtn.on { color:#fff; background:var(--accent); }
  .gcx-fbtn.on:hover { background:var(--accent-hover) !important; color:#fff !important; }

  /* a heading turned into a search box */
  .gcx-head .h.gcx-hf.open { gap:2px; }
  .gcx-hs { flex:1 1 auto; min-width:0; height:24px; border:1px solid var(--accent); border-radius:var(--r-sm);
    background:var(--n0); padding:0 7px; font:inherit; font-size:11.5px; font-weight:500; text-transform:none;
    letter-spacing:0; color:var(--n800); box-shadow:0 0 0 3px var(--accent-soft); }
  .gcx-hs:focus { outline:none; }
  .gcx-hs::placeholder { color:var(--n300); font-weight:400; }
  .gcx-fx { flex:none; width:20px; height:20px; border-radius:4px; display:grid; place-items:center; border:none;
    background:transparent; color:var(--n400); cursor:pointer; }
  .gcx-fx:hover { background:var(--n150); color:var(--n800); }

  /* and one turned into a checkbox list */
  /* fixed, and placed by _placeMenus — see .ms-pop for why absolute could not work */
  .gcx-fmenu { position:fixed; z-index:100; min-width:158px; max-height:250px; overflow:auto;
    background:var(--n0); border:var(--hairline); border-radius:var(--r-md); box-shadow:var(--shadow-lg); padding:5px;
    text-transform:none; letter-spacing:0; font-weight:400; }

  /* clearing everything, once anything is on */
  .gcx-clear { display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 10px; border-radius:var(--r-md);
    border:1px solid var(--n200); background:var(--n0); font:inherit; font-size:12px; font-weight:550;
    color:var(--n600); cursor:pointer; }
  .gcx-clear:hover { border-color:var(--danger-border); color:var(--danger-text); background:var(--danger-soft); }
  .gcx-body { min-width:1030px; }

  .gcx-row { border-bottom:1px solid var(--n150); position:relative; }
  .gcx-row:last-child { border-bottom:none; }
  .gcx-row::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--stage,transparent); }
  .gcx-cells { display:grid; grid-template-columns:var(--gcx-cols); gap:8px; align-items:center; padding:8px 16px;
    transition:background var(--dur-1) var(--ease); }
  .gcx-cells:hover { background:var(--n50); }
  .gcx-row.open .gcx-cells { background:var(--accent-soft); }
  .gcx-row.off .gcx-cells { opacity:0.55; }
  .gcx-tap { cursor:pointer; }

  .gcx-sno { font-size:12px; color:var(--n400); font-weight:600; font-variant-numeric:tabular-nums; text-align:center; }
  .gcx-cl { min-width:0; display:flex; align-items:center; gap:8px; }
  .gcx-cl .nm { flex:1 1 auto; min-width:0; cursor:pointer; }
  .gcx-cl .nm .t { display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:650; color:var(--n900); letter-spacing:-0.01em; }
  .gcx-cl .nm .t span.n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gcx-cat { flex:none; font-size:9.5px; font-weight:700; color:var(--n500); border:1px solid var(--n200);
    border-radius:4px; padding:0 4px; line-height:1.45; }
  /* reaching the client is the commonest thing to want from a row, so it sits with the name */
  .gcx-wa { flex:none; width:24px; height:24px; border-radius:var(--r-sm); display:grid; place-items:center;
    border:none; background:transparent; color:var(--success-text); cursor:pointer;
    transition:background var(--dur-1) var(--ease); }
  .gcx-wa:hover { background:var(--success-soft); }
  .gcx-wa:focus-visible { outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  .gcx-asg { flex:0 1 auto; display:flex; align-items:center; gap:5px; min-width:0; }
  .gcx-av { flex:none; width:20px; height:20px; border-radius:var(--r-full); display:grid; place-items:center;
    background:var(--accent-soft); color:var(--accent-hover); font-size:10px; font-weight:700; }
  .gcx-asg select { border:none; background:transparent; font:inherit; font-size:12px; font-weight:550; color:var(--n600);
    cursor:pointer; max-width:66px; padding:2px 0; }
  .gcx-asg select:focus { outline:none; color:var(--n900); }

  .gcx-c { display:flex; justify-content:center; }

  /* challan: a pill that carries its own colour */
  .gcx-pill { display:inline-flex; align-items:center; gap:5px; width:100%; height:29px; padding:0 6px 0 9px;
    border-radius:var(--r-md); border:1px solid var(--pb,var(--n200)); background:var(--pbg,var(--n100)); color:var(--pc,var(--n500)); }
  .gcx-pill .pd { width:7px; height:7px; border-radius:var(--r-full); background:currentColor; flex:none; opacity:0.85; }
  .gcx-pill select { flex:1 1 auto; min-width:0; border:none; background:transparent; font:inherit; font-size:12.5px;
    font-weight:600; color:inherit; cursor:pointer; padding:0; }
  .gcx-pill select:focus { outline:none; }
  .gcx-pill select option { background:var(--n0); color:var(--n800); font-weight:500; }
  /* the compact form used by bank, purchase and sales: no dot, tighter padding, so a real
     dropdown occupies the width the tap-icon used to */
  .gcx-pill.tight { padding:0 2px 0 7px; height:27px; }
  .gcx-pill.tight select { font-size:12px; }
  .gcx-pill.tight .ro { font-size:12px; font-weight:600; padding:0 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gcx-pill:focus-within { box-shadow:0 0 0 3px var(--accent-soft); }

  /* filed: one switch, unmistakable at a glance */
  .gcx-filed { width:34px; height:34px; border-radius:var(--r-full); display:inline-grid; place-items:center; border:none;
    background:transparent; cursor:pointer; transition:transform .14s cubic-bezier(.34,1.56,.64,1), background var(--dur-1) var(--ease); }
  .gcx-filed:hover { background:var(--n100); }
  .gcx-filed:active { transform:scale(0.86); }
  .gcx-filed[disabled] { opacity:0.4; cursor:default; }

  /* note and remark: plain text until you touch them */
  /* One line at rest; while it is being written in it opens downwards over the rows below,
     the same way the task remarks behave, so a long note is readable without widening. */
  textarea.gcx-note { width:100%; min-width:0; border:1px solid transparent; background:transparent; border-radius:var(--r-sm);
    padding:4px 7px; margin:-4px -7px; font:inherit; font-size:12px; color:var(--n500); line-height:1.5;
    resize:none; overflow:hidden; height:26px; white-space:nowrap; }
  textarea.gcx-note:hover { background:var(--n50); }
  textarea.gcx-note:focus { outline:none; background:var(--n0); border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); color:var(--n800); }
  textarea.gcx-note.open { white-space:pre-wrap; overflow:auto; position:relative; z-index:9; box-shadow:var(--shadow-lg); }
  textarea.gcx-note::placeholder { color:var(--n300); }
  .gcx-note.ro { display:block; font-size:12px; color:var(--n500); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gcx-rem { font-size:12.5px; color:var(--n700); }
  /* the row ends with the one thing you might want to do to a whole client */
  .gcx-del { width:26px; height:26px; border-radius:var(--r-sm); display:inline-grid; place-items:center; justify-self:center;
    border:none; background:transparent; color:var(--n300); cursor:pointer; }
  .gcx-del:hover { color:var(--danger-text); background:var(--danger-soft); }
  .gcx-chev { color:var(--n400); justify-self:center; cursor:pointer; transition:transform var(--dur-2, .22s) var(--ease); }
  .gcx-row.open .gcx-chev { transform:rotate(90deg); color:var(--n600); }

  /* the expanded panel: two columns of cards */
  .gcx-detail { background:var(--n25); border-top:1px solid var(--n150); }
  .gcx-din { padding:11px 16px 13px; display:grid; grid-template-columns:1fr 1fr 1.45fr; gap:11px; align-items:start; }
  .gcx-dcol { display:flex; flex-direction:column; gap:11px; min-width:0; }
  .gcx-card { background:var(--n0); border:1px solid var(--n150); border-radius:var(--r-lg); box-shadow:var(--shadow-xs); overflow:hidden; }
  .gcx-ch { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--n150); background:var(--n25); }
  .gcx-ci { width:23px; height:23px; border-radius:7px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); flex:none; }
  .gcx-ct { font-size:10.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--n500); }
  .gcx-tag { margin-left:auto; font-size:10px; font-weight:500; color:var(--n400); }
  .gcx-cb { padding:2px 12px 6px; }
  .gcx-frow { display:grid; grid-template-columns:104px minmax(0,1fr); align-items:center; gap:10px; padding:5px 0; border-top:1px solid var(--n100); }
  .gcx-frow:first-child { border-top:none; }
  .gcx-frow .k { font-size:11.5px; color:var(--n500); }
  .gcx-fv { display:flex; align-items:center; gap:5px; min-width:0; }
  .gcx-fin { flex:1 1 auto; min-width:0; border:1px solid transparent; background:transparent; border-radius:var(--r-sm);
    padding:4px 7px; margin:-4px -7px; font:inherit; font-size:12.5px; font-weight:500; color:var(--n800);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gcx-fin.ed { cursor:text; }
  .gcx-fin.ed:hover { background:var(--n50); }
  .gcx-fin.code { font-family:var(--mono, ui-monospace, monospace); font-size:12px; }
  .gcx-fin.empty { color:var(--n300); font-weight:400; }
  .gcx-mini { flex:none; width:25px; height:25px; border-radius:var(--r-sm); display:grid; place-items:center; color:var(--n400);
    border:1px solid var(--n200); background:var(--n0); cursor:pointer; font-size:12px; }
  .gcx-mini:hover { color:var(--n800); border-color:var(--n300); }
  .gcx-mini.wa:hover { color:var(--success-text); border-color:var(--success-border); background:var(--success-soft); }

  /* return figures, in the four groups the sheet works in */
  /* minmax(0,1fr), not 1fr: a plain 1fr refuses to shrink below its content, so the right
     column pushed past the card and the card's clip cut its border off. */
  .gcx-figs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; padding:8px 11px 10px; }
  .gcx-fg { background:var(--n25); border:1px solid var(--n150); border-radius:var(--r-md); padding:7px 10px; }
  .gcx-fgh { font-size:9.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--n400); margin-bottom:5px; }
  .gcx-fgh em { font-style:normal; font-weight:500; letter-spacing:0; text-transform:none; color:var(--n300); }
  .gcx-fgr { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:3px 0; }
  .gcx-fgr label { flex:1 1 auto; min-width:0; font-size:10.5px; font-weight:600; color:var(--n500);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gcx-amt { flex:0 1 auto; min-width:76px; display:inline-flex; align-items:center; gap:2px; height:27px; padding:0 8px;
    border:1px solid var(--n200); border-radius:var(--r-sm); background:var(--n0); }
  .gcx-amt:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .gcx-amt i { font-style:normal; font-size:11.5px; color:var(--n400); font-family:var(--mono, ui-monospace, monospace); }
  .gcx-amt input { width:100%; min-width:0; border:none; background:transparent; text-align:right; font:inherit; font-size:12px;
    font-weight:500; color:var(--n800); font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums; padding:0; }
  .gcx-amt input:focus { outline:none; }
  .gcx-amtro { font-size:12px; font-weight:600; color:var(--n800); font-family:var(--mono, ui-monospace, monospace); }
  .gcx-fgs { display:flex; align-items:center; justify-content:space-between; margin-top:6px; padding-top:6px;
    border-top:1px dashed var(--n200); font-size:11px; color:var(--n500); }
  .gcx-fgs b { color:var(--n800); font-family:var(--mono, ui-monospace, monospace); font-weight:600; }


  /* ---- the record, inside the row ----
     This was a modal for a while. It did show a client's whole position at once, which the
     old two-column panel could not, but it read as a different app — the list vanished
     behind it and no other tab opens that way. The layout that made it work is kept and put
     back in the row, so Composition expands exactly as GST and Acct & Final do.
     Only what the row cannot already show is here: Note and Remark stay in their columns
     rather than being edited in two places at once. */
  /* Client status, shared by GST and Composition. Active in green, anything else in red
     — the one colour here that earns its keep, because it changes what every other field
     in the row means. */
  .act-st.on  { background:var(--st-dn-bg); color:var(--st-dn-fg); font-weight:600; }
  .act-st.off { background:var(--st-ns-bg); color:var(--st-ns-fg); font-weight:600; }
  .act-st.ro { display:inline-flex; align-items:center; height:25px; padding:0 9px; border-radius:var(--r-sm);
    font-size:12px; }
  select.act-st { height:27px; padding:0 6px; border:1px solid var(--n200); border-radius:var(--r-sm);
    font:inherit; font-size:12px; max-width:132px; }
  /* the same "this client is off" tag both lists put beside the name */
  .act-tag { flex:none; font-size:9.5px; font-weight:700; color:var(--n400); border:1px solid var(--n200);
    border-radius:4px; padding:0 5px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap; }
  /* Cancelled clients are parked at the foot of the list under their own heading \u2014 still on
     the books, but not this period's work, so they stop sitting between clients that are. */
  .act-sec { padding:7px 16px; background:var(--n25); border-top:1px solid var(--n200);
    border-bottom:1px solid var(--n150); font-size:10.5px; font-weight:700; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--n500); }
  .act-sec b { color:var(--n400); font-weight:700; margin-left:4px; font-variant-numeric:tabular-nums; }
  tr.act-secrow td { padding:7px 10px !important; background:var(--n25); border-top:1px solid var(--n200);
    font-size:10.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--n500); }
  tr.gst-main.off td { opacity:0.55; }

  /* Two columns leaves the figures card alone on its own row with half the width empty
     beside it, so below this it takes the whole row — which its own 2x2 grid wants anyway. */
  @media (max-width: 1080px) { .gcx-din { grid-template-columns:1fr 1fr; }
    .gcx-din > .gcx-dcol:nth-child(3) { grid-column:1 / -1; } }
  @media (max-width: 680px)  { .gcx-din { grid-template-columns:1fr; } .gcx-figs { grid-template-columns:1fr; } }

  .gcx-empty { padding:56px 20px; text-align:center; color:var(--n500); }
  .gcx-empty .h { font-size:14.5px; font-weight:600; color:var(--n700); margin-bottom:4px; }

  /* the figures keep their two columns; the modal grid below decides when to collapse */

  /* ==================== GST compliance module ====================
     Deliberately thin: the header, table, chips and footer reuse the Acct & Final classes
     (.af-modhead / .af-roletabs / .af-tscroll / .af-footbar …) and the Fees KPI cards, so
     this tab reads as another module of the same tracker rather than its own product.
     Only what is genuinely GST-specific lives here. */
  .af-modtitle .gst-monthsel { font:inherit; font-size:10.5px; font-weight:600; color:var(--n500); border:1px solid var(--n200);
    border-radius:var(--r-sm); padding:1px 4px; background:var(--n0); cursor:pointer; }
  .af-modtitle .gst-monthsel:focus { outline:none; border-color:var(--accent); }

  /* KPI strip — same card as the Fees tab, made clickable so each one filters the list */
  .gst-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; padding:12px 18px; border-bottom:1px solid var(--n150); }
  button.fees-kpi { text-align:left; font-family:inherit; cursor:pointer; transition:border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease); }
  button.fees-kpi:hover { border-color:var(--n300); }
  button.fees-kpi.on { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  button.fees-kpi[disabled] { cursor:default; }
  .fees-kpi-num small { font-size:12px; color:var(--n400); font-weight:500; }
  .fees-kpi-bar { height:3px; border-radius:2px; background:var(--n150); margin-top:7px; overflow:hidden; }
  .fees-kpi-bar i { display:block; height:100%; border-radius:2px; background:var(--success); }

  /* table: the Acct & Final frame, with the columns this module needs */
  /* 12 columns: trim the cell padding and cap the selects so the table fits a normal
     screen instead of scrolling sideways; it still scrolls on narrow ones. */
  .af-tscroll.gst-wide table { min-width:980px; }
  .af-tscroll.gst-wide th, .af-tscroll.gst-wide td { padding-left:8px; padding-right:8px; }
  /* A module card that fills the window: the rows scroll inside their own box instead of
     moving the whole page, so the headings, the filter row and everything above them stay
     put. Only the card's height is set at runtime (see fitModule) — the table then takes
     whatever the head, the totals strip, the add-row and the footer leave over, so any of
     those growing or wrapping costs table rows and nothing else. Shared by GST and
     Acct & Final: add .mod-fill to a module card and it behaves the same way. */
  main.mod-fill-page { padding-bottom:14px; }
  .af-mod.mod-fill { display:flex; flex-direction:column; margin-bottom:0; }
  .af-mod.mod-fill > .af-tscroll { flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; }
  .af-mod.mod-fill .af-tscroll thead th { position:sticky; top:0; z-index:6; background:var(--n0); }
  .af-mod.mod-fill .af-tscroll thead tr.filter-row td { position:sticky; z-index:5; }
  .af-mod.mod-fill .af-tscroll tbody tr:last-child td { border-bottom:none; }
  .af-tscroll tbody tr.gst-main { cursor:pointer; }
  .gst-cname { cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
  .gst-cname:hover { color:var(--accent); }
  .af-tscroll tbody tr.gst-detail td { padding:0 13px 14px; background:var(--n25); }
  .af-tscroll tbody tr.gst-detail:hover td { background:var(--n25); }
  .af-tscroll th.gst-sortable { cursor:pointer; }
  .af-tscroll th.gst-sortable:hover { color:var(--n800); }
  .gst-sep { border-left:2px solid var(--n150); }

  /* status selects — same shape as the Acct & Final stage select */
  select.gst-sel { border:1px solid transparent; border-radius:7px; padding:4px 6px; font:inherit; font-size:12px; font-weight:600;
    cursor:pointer; background:var(--n0); color:var(--n800); max-width:116px; }
  select.gst-sel:hover { border-color:var(--n300); }
  select.gst-sel option { background:var(--n0); color:var(--n800); }
  /* No status tints here: with four status columns side by side the colour was doing more
     shouting than telling, so every one of them reads as a plain control. */
  .gst-ro { display:inline-flex; font-size:12px; font-weight:600; border-radius:7px; padding:4px 9px;
    white-space:nowrap; color:var(--n700); }

  /* column filters: a button that opens a checkbox list, so several statuses can be on at once */
  .gst-cf { position:relative; }
  .gst-cf-btn { display:flex; align-items:center; gap:4px; width:100%; min-width:92px; padding:4px 7px; font:inherit; font-size:11.5px;
    border:1px solid var(--n200); border-radius:var(--r-sm); background:var(--n0); color:var(--n700); cursor:pointer; text-align:left; }
  .gst-cf-btn span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gst-cf-btn .icn { flex:none; color:var(--n400); }
  .gst-cf-btn:hover { border-color:var(--n300); }
  .gst-cf-btn.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .gst-cf-btn.on .icn { color:var(--accent); }
  .gst-cf.open .gst-cf-btn { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  /* fixed, and placed by _placeMenus — see .ms-pop for why absolute could not work */
  .gst-cf-menu { position:fixed; z-index:100; min-width:172px; max-height:262px; overflow:auto;
    background:var(--n0); border:var(--hairline); border-radius:var(--r-md); box-shadow:var(--shadow-lg); padding:5px; }
  .gst-cf-opt { display:flex; align-items:center; gap:8px; padding:5px 7px; border-radius:var(--r-sm); font-size:12px;
    color:var(--n700); cursor:pointer; white-space:nowrap; }
  .gst-cf-opt:hover { background:var(--n50); }
  .gst-cf-opt.all { font-weight:600; border-bottom:1px solid var(--n150); border-radius:0; margin-bottom:3px; padding-bottom:7px; }
  .gst-cf-opt input { flex:none; width:14px; height:14px; margin:0; accent-color:var(--accent); cursor:pointer; }
  .gst-cf-none { padding:7px; font-size:11.5px; color:var(--n400); }
  /* funnel-in-a-column-heading variant (Settings → Client Master) */
  .gst-cf-inhead { display:inline-block; vertical-align:middle; margin-left:5px; }
  .gst-cf-inhead .gst-cf-btn { display:inline-grid; place-items:center; width:auto; min-width:0; padding:2px 5px; }
  .gst-cf-menu { text-transform:none; letter-spacing:normal; font-weight:400; }

  /* overdue-from-earlier badge */
  .gst-warn { display:inline-grid; place-items:center; min-width:15px; height:15px; margin-left:5px; padding:0 4px; border-radius:var(--r-full);
    background:var(--danger); color:#fff; font-size:9.5px; font-weight:700; vertical-align:middle; cursor:help; }
  .gst-delmonth:hover { border-color:var(--danger-border); color:var(--danger-text); background:var(--danger-soft); }
  .gst-delmonth[disabled] { opacity:0.35; cursor:default; }
  .gst-delmonth[disabled]:hover { border-color:var(--n200); color:var(--n500); background:transparent; }

  /* WhatsApp icon — matches the row icons used on the task and fees tables */
  .gst-wa { display:inline-grid; place-items:center; width:26px; height:24px; border:none; background:transparent;
    border-radius:var(--r-sm); color:var(--success-text); cursor:pointer; }
  .gst-wa:hover { background:var(--success-soft); }
  .gst-wa[disabled] { color:var(--n300); cursor:default; }
  .gst-wa[disabled]:hover { background:transparent; }

  /* remark: one line at rest, grows downward while being written (like the task remarks) */
  textarea.gst-rem { width:100%; min-width:0; border:1px solid var(--n200); border-radius:var(--r-sm); padding:3px 8px; font:inherit; font-size:11.5px;
    background:var(--n0); resize:none; overflow:hidden; height:26px; line-height:1.5; white-space:nowrap; text-overflow:ellipsis; }
  textarea.gst-rem:focus { outline:none; border-color:var(--accent); }
  textarea.gst-rem::placeholder { color:var(--n400); }
  textarea.gst-rem.open { white-space:pre-wrap; overflow:auto; position:relative; z-index:5; box-shadow:var(--shadow-md); }
  .gst-remview { font-size:11.5px; color:var(--n600); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* expanded client details */
  .gst-dwrap { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; font-size:12px; color:var(--n600); padding-top:10px; }
  .gst-ditem { display:inline-flex; align-items:center; gap:5px; }
  /* everything from here hugs the right-hand edge of the row */
  .gst-ditem.gst-dright { margin-left:auto; }
  .gst-delclient { color:var(--n300); }
  .gst-delclient:hover { color:var(--danger-text); background:var(--danger-soft); border-color:var(--danger-border); }
  .gst-dlbl { font-size:10.5px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; color:var(--n400); }
  .gst-dval { font-weight:500; color:var(--n800); }
  .gst-dval.mono { font-family:var(--mono, ui-monospace, monospace); letter-spacing:0.02em; }
  .gst-ed { cursor:text; border-bottom:1px dashed transparent; }
  .gst-ed:hover { border-bottom-color:var(--n300); background:var(--n100); border-radius:3px; }

  /* dialogs (edit a detail, add or remove a period, compose a reminder) */
  /* above the Composition record panel (130), which is itself opened over the list — an
     edit box that lands behind the thing it was opened from cannot be typed into. */
  .gst-ov { position:fixed; inset:0; background:rgba(16,24,40,0.45); display:none; place-items:center; z-index:140; padding:20px; }
  .gst-ov.show { display:grid; }
  .gst-modal { background:var(--n0); border:var(--hairline); border-radius:var(--r-xl); box-shadow:var(--shadow-lg); width:min(520px,100%);
    max-height:90vh; overflow:auto; padding:18px; }
  .gst-modal h3 { margin:0 0 4px; font-size:14px; font-weight:650; }
  .gst-mctx { font-size:11.5px; color:var(--n500); background:var(--n50); border-radius:var(--r-md); padding:8px 10px; margin:8px 0 10px; }
  .gst-mtabs { display:flex; gap:5px; background:var(--n100); border-radius:var(--r-md); padding:4px; margin-bottom:10px; }
  .gst-mtab { flex:1; font-size:12.5px; font-weight:600; padding:6px 10px; border-radius:7px; border:none; background:transparent;
    color:var(--n600); cursor:pointer; font-family:inherit; }
  .gst-mtab:hover { background:var(--n0); }
  .gst-mtab.on { background:var(--accent); color:#fff; }
  .gst-mtext { width:100%; min-height:200px; border:1px solid var(--n200); border-radius:var(--r-md); padding:10px 12px; font:inherit;
    font-size:12.5px; line-height:1.55; resize:vertical; background:var(--n0); }
  .gst-mtext:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .gst-mfoot { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .gst-fld { margin-bottom:10px; }
  .gst-fld label { display:block; font-size:11px; font-weight:600; color:var(--n500); margin-bottom:4px; }
  .gst-fld input, .gst-fld select { width:100%; padding:8px 10px; border:1px solid var(--n200); border-radius:var(--r-sm); font:inherit; font-size:13px; background:var(--n0); }
  .gst-fld input:focus, .gst-fld select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .gst-fld.half { display:inline-block; width:calc(50% - 5px); vertical-align:top; }
  .gst-fld.half + .gst-fld.half { margin-left:10px; }
  .gst-dlg-err { display:none; font-size:11.5px; color:var(--danger-text); background:var(--danger-soft); border:1px solid var(--danger-border);
    border-radius:var(--r-sm); padding:7px 10px; margin:8px 0 10px; }
  .gst-dlg-err.show { display:block; }
</style>
</head>
<body>
<header id="header"></header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="save-flash" id="saveFlash">Saved</div>
<script>
const STORAGE_KEY = "pujara_co_task_tracker_v4";
const ALL_KEYS = ["pujara_co_task_tracker_v4","pujara_co_task_tracker_v3","pujara_co_task_tracker_v2","pujara_co_task_tracker_v1"];
const LEGACY_EMPLOYEES = ["Emp 1","Emp 2","Emp 3","Emp 4","Emp 5","Emp 6","Emp 7","Emp 8","Emp 9","Emp 10"];
let EMPLOYEES = []; /* live ref to state.employees — set after load(); admins add via Settings */
/* Admin 2 and Admin 3 are admin-named keys. Emp 10 (Heena) was promoted in place instead:
   her clients, tasks and history are all filed under that key, and a fresh Admin 4 key
   would have stranded every one of them. Admin rights follow the key, not its name. */
const ADMINS = ["Super Admin","Admin","Admin 2","Admin 3","Emp 10"];
const STATUSES = ["Not Started","In Progress","On Hold","Ready for Review","Ready to File","Done","To Be Billed","Billed","Not to Bill","Received"];
const EMP_STATUSES = ["Not Started","In Progress","On Hold","Ready for Review","Ready to File","Done"];
const EMP_ACTIVE = ["Not Started","In Progress","On Hold","Ready for Review"];
const EMP_ARCHIVE = ["Done","Ready to File"];

   route through openWhatsApp. Phone + prefilled text are read from the anchor's wa.me href. */
function _waClick(ev, el) {
  if (ev) { if (ev.stopPropagation) ev.stopPropagation(); if (ev.preventDefault) ev.preventDefault(); }
  var href = (el && el.getAttribute('href')) || '';
  var pm = href.match(/wa\.me\/(\d+)/);
  var phone = pm ? pm[1] : '';
  var encoded = '';
  /* PERF: task rows carry only data-tid and a bare wa.me href — the prefilled message is built
     HERE, on click, instead of being encoded into ~1200 hrefs (~650KB) on every re-render.
     Rows without data-tid (e.g. the Fees table) keep the old href-based text. */
  var tid = el && el.getAttribute && el.getAttribute('data-tid');
  var fid = el && el.getAttribute && el.getAttribute('data-fid');
  if (tid) {
    var task = (state.tasks || []).find(function (x) { return String(x.id) === String(tid); });
    var m = task ? _waMessage(task) : '';
    if (m) encoded = encodeURIComponent(m);
  } else if (fid) {                       /* Fees row: build the GST fee message from THAT row */
    var fe = (state.feesEntries || []).find(function (x) { return String(x.id) === String(fid); });
    var fm = fe ? _feeReminderMsg(fe) : '';
    if (fm) encoded = encodeURIComponent(fm);
  } else {
    var tm = href.match(/[?&]text=([^&]*)/);
    encoded = tm ? tm[1] : '';

}

/* GST annual fee message config. Bank details are FIXED (never taken from a client record);
   the financial year lives here so it is a one-line change each year. */
var FEE_CFG = {
  fy: '2025-26',
  bank: 'Pujara Biz – Bank Details\nSouth Indian Bank, Bopal\nA/c No.: 081107300000270\nIFSC: SIBL0000811',
  signOff: 'Regards,\nPujara Biz'

/* Fee message for one GST Annual row. Contact Person / Trade Name / GSTIN / Bill Amount all

   client never sees "undefined", "null" or an unresolved placeholder. */
function _feeReminderMsg(entry) {
  const e = entry || {};

  const contact = val(e.contactPerson);
  const trade   = val(e.tradeName);
  const gstin   = val(e.gstin);
  /* Bill Amount only — never lastYearFees / recdAmount / outstanding. */
  const amt = (e.billAmount != null && !isNaN(e.billAmount) && Number(e.billAmount) > 0)
    ? Number(e.billAmount) : null;
  let subj;
  if (trade && gstin) subj = 'For ' + trade + ', GSTIN ' + gstin + ', the';
  else if (trade)     subj = 'For ' + trade + ', the';
  else if (gstin)     subj = 'For GSTIN ' + gstin + ', the';
  else                subj = 'The';
  const feeLine = subj + ' professional fee for Annual GST Return Compliance for F.Y. ' + FEE_CFG.fy

    + feeLine + '\n\n'

function _formatMt(mt) {
  if (!mt) return "";
  const diff = Date.now() - Number(mt);
  if (diff < 0 || isNaN(diff)) return "";
  const sec = Math.floor(diff / 1000);
  if (sec < 45) return "just now";
  const min = Math.floor(sec / 60);
  if (min < 60) return min + "m ago";
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + "h ago";
  const day = Math.floor(hr / 24);
  if (day < 30) return day + "d ago";
  const d = new Date(Number(mt));
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate() + " " + months[d.getMonth()];
}

function attemptLogin() {
  const pin = _normalizeMpin(String(_gateRawCred() || "").trim());
  if (!pin) { gateError = "Enter your full 4-digit MPIN."; renderGate(); return; }
  const rp = state.roleMpin || {};
  let matched = null;
  for (const role of allRoles()) {
    if (_normalizeMpin(rp[role]) === pin) { matched = role; break; }
  }
  if (!matched) { gateError = "MPIN not recognised. Ask admin to set it in Settings."; renderGate(); return; }
  state.session = { user: matched };

  if (matched === "Super Admin") state.activeTab = "Super Admin";

function _superSearchKey(e) {
  const dd = document.getElementById('superSearchDD');
  if (!dd) return;
  if (e.key === 'Escape') { dd.style.display = 'none'; return; }
  const opts = Array.from(dd.querySelectorAll('.super-search-opt'));
  if (opts.length === 0) return;
  const curIdx = opts.findIndex(o => o.classList.contains('hl'));
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = curIdx < 0 ? 0 : Math.min(opts.length - 1, curIdx + 1);
    opts.forEach((o, i) => o.classList.toggle('hl', i === next));
    opts[next].scrollIntoView({block: 'nearest'});
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = curIdx <= 0 ? 0 : curIdx - 1;
    opts.forEach((o, i) => o.classList.toggle('hl', i === prev));
    opts[prev].scrollIntoView({block: 'nearest'});
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const target = curIdx >= 0 ? opts[curIdx] : opts[0];
    if (target) _pickSuperClient(target.dataset.name);
  }
}

/* ---- 4-box MPIN entry (digits only) ---- */
function _pinBoxes() { return [0,1,2,3].map(i => document.getElementById("gate-pin-" + i)); }
function _gatePinVal() { return _pinBoxes().map(b => (b && b.value) || "").join(""); }
/* Distribute digits into boxes starting at slot i. Returns the next empty slot index. */
function _pinSet(i, raw) {
  const boxes = _pinBoxes();
  let idx = i;
  for (const ch of String(raw || "")) {
    if (idx > 3 || !boxes[idx]) break;
    if (/[0-9]/.test(ch)) { boxes[idx].value = ch; idx++; }
  }
  return idx;
}
function _pinAfterChange() {
  if (_gatePinVal().length === 4) attemptLogin();
}
function _pinInput(i, el) {
  const raw = el.value;
  el.value = "";
  const next = _pinSet(i, raw);
  const boxes = _pinBoxes();
  const target = boxes[Math.min(next, 3)];
  if (target) target.focus();
  _pinAfterChange();
}
function _pinKey(i, e) {
  const boxes = _pinBoxes();
  if (e.key === "Backspace") {
    e.preventDefault();
    const el = boxes[i];
    if (el && el.value) { el.value = ""; }
    else if (i > 0 && boxes[i-1]) { boxes[i-1].value = ""; boxes[i-1].focus(); }
  } else if (e.key === "ArrowLeft" && i > 0) { e.preventDefault(); boxes[i-1].focus();
  } else if (e.key === "ArrowRight" && i < 3) { e.preventDefault(); boxes[i+1].focus();
  } else if (e.key === "Enter") { e.preventDefault(); attemptLogin(); }
}
function _pinPaste(e) {
  e.preventDefault();
  const txt = (e.clipboardData || window.clipboardData) ? (e.clipboardData || window.clipboardData).getData("text") : "";
  const next = _pinSet(0, txt);
  const boxes = _pinBoxes();
  const target = boxes[Math.min(next, 3)] || boxes[0];
  if (target) target.focus();
  _pinAfterChange();
}
/* The raw credential the user entered. */
function _gateRawCred() { return _gatePinVal(); }

    alert("MPIN must be exactly 4 digits, e.g. the birthday as DDMM.\n\nExample: born 24 March → 2403");
    render();
    return;
  }
  /* Two people must never share an MPIN — login couldn't tell them apart. */
  for (const [other, p] of Object.entries(state.roleMpin)) {
    if (other !== role && _normalizeMpin(p) === v) {
      alert("That MPIN is already used by " + (state.empNames[other] || other) + ".\n\nTwo people cannot share the same 4 digits — give one of them different digits.");

}

/* ==================== EMPLOYEE MANAGEMENT (dynamic) ==================== */
function addEmployee() {
  const nameEl = document.getElementById("newEmpName");
  const mobEl  = document.getElementById("newEmpMobile");
  const name = ((nameEl && nameEl.value) || "").trim();
  const mobile = mobEl ? normalizeMobile(mobEl.value) : "";
  if (!name) { alert("Enter employee name."); return; }
  /* Reject if name conflicts with admin display name or admin role */
  for (const a of ADMINS) {
    if (a.toLowerCase() === name.toLowerCase()) { alert("Name conflicts with an admin role."); return; }
    const adn = String(state.empNames[a] || "").trim().toLowerCase();
    if (adn && adn === name.toLowerCase()) { alert("Name conflicts with " + a + " (" + state.empNames[a] + ")."); return; }
  }
  /* Reject if duplicate among existing employees */
  for (const e of state.employees) {
    if (displayName(e).toLowerCase() === name.toLowerCase()) { alert("An employee with that name already exists."); return; }
  }
  /* Reject duplicate mobile across all roles */
  if (mobile) {
    const rm = state.roleMobile || {};
    for (const [role, m] of Object.entries(rm)) {
      if (normalizeMobile(m) === mobile) {
        alert("That mobile is already used by " + (state.empNames[role] || role) + ". Each person needs a unique mobile.");
        return;
      }
    }
  }
  /* Generate stable slot id */
  let n = 1; const used = new Set(state.employees);
  while (used.has("emp_" + n) || used.has("Emp " + n)) n++;
  const slot = "emp_" + n;
  state.employees.push(slot);
  EMPLOYEES = state.employees;
  state.empNames[slot] = name;
  if (mobile) {
    if (!state.roleMobile) state.roleMobile = {};
    state.roleMobile[slot] = mobile;
  }
  if (nameEl) nameEl.value = "";
  if (mobEl) mobEl.value = "";
  save(); render();
}
function removeEmployee(emp) {
  const dn = displayName(emp);
  const tasks = state.tasks.filter(t => t.assignee === emp);
  if (tasks.length > 0) {
    const choice = prompt("Delete employee \"" + dn + "\"?\n\nThey have " + tasks.length + " task(s).\n\nType the display name of an admin/employee to reassign their tasks to, OR leave blank to reassign to Admin, OR type CANCEL to abort.", "Admin");
    if (choice === null || String(choice).trim().toUpperCase() === "CANCEL") return;
    const target = String(choice || "Admin").trim();
    /* Find role by display name */
    let targetSlot = null;
    for (const role of allRoles()) {
      if (displayName(role).toLowerCase() === target.toLowerCase() || role.toLowerCase() === target.toLowerCase()) {
        targetSlot = role; break;
      }
    }
    if (!targetSlot) { alert("No role found matching \"" + target + "\". Aborted."); return; }
    if (targetSlot === emp) { alert("Cannot reassign tasks to the same employee. Aborted."); return; }
    state.tasks.forEach(t => { if (t.assignee === emp) t.assignee = targetSlot; });
  } else {
    if (!confirm("Delete employee \"" + dn + "\"?")) return;
  }
  const idx = state.employees.indexOf(emp);
  if (idx >= 0) state.employees.splice(idx, 1);
  EMPLOYEES = state.employees;
  delete state.empNames[emp];
  if (state.roleMobile) delete state.roleMobile[emp];
  save(); render();
}

/* ===== Quiet per-row date stamps =====

    if (String(e.taskId) !== String(taskId)) continue;
    if (e.action !== 'status_changed' && e.action !== 'created') continue;
    const f = e.from == null ? '' : String(e.from);

   brought a change. Now the log is indexed ONCE into a {taskId|status -> latest ts} map and
   each lookup is O(1). Cache key is (array identity, length), which covers every way the log

/* ==================== Dashboard helpers (v18) ==================== */
const ACTIVE_STATUSES = ["Not Started","In Progress","On Hold","Ready for Review"];
const CLOSED_STATUSES = ["Done","Billed","Not to Bill","Received","Ready to File"];

function _daysAgo(ts) {
  if (!ts) return 0;
  const t = (typeof ts === "string") ? new Date(ts).getTime() : Number(ts);
  if (!t) return 0;
  return Math.floor((Date.now() - t) / 86400000);
}
function _dashLog() {
  const u = state.session && state.session.user;
  return (u === "Super Admin") ? (state.activityLog || []) : visibleActivityLog();
}
function _daysSinceStatus(taskId, status) {
  const log = _dashLog();
  for (let i = log.length - 1; i >= 0; i--) {
    const e = log[i];
    if (String(e.taskId) === String(taskId) && e.action === "status_changed" && e.to === status) {
      return _daysAgo(e.ts);

  const end = Date.now() - daysToAgo * 86400000;
  const ids = new Set();
  for (const e of log) {
    /* status_changed INTO the target, or a task CREATED directly in the target status */
    if (e.action !== "status_changed" && e.action !== "created") continue;
    if (!toStatuses.includes(e.to)) continue;

    if (t >= start && t <= end) ids.add(String(e.taskId));

  const onHoldArr = active.filter(t => t.status === "On Hold");
  const done = tasks.filter(t => t.status === "Done");
  const billed = tasks.filter(t => t.status === "Billed");
  const notToBill = tasks.filter(t => t.status === "Not to Bill");

  const closedPrev = _countMovedToInWindow(["Done"], 14, 7);

  const recv60Plus = billed.filter(t => _daysSinceStatus(t.id, "Billed") > 60).length;

    active: active.length, notStarted, inProg, onHold: onHoldArr.length, stuckOH,
    done: done.length, billed: billed.length, notToBill: notToBill.length,

    if (!byClient[c]) byClient[c] = { count: 0, oldestDays: 0, taskIds: [] };
    byClient[c].count++;
    byClient[c].taskIds.push(t.id);
    if (days > byClient[c].oldestDays) byClient[c].oldestDays = days;

        <span class="dot" style="background:${_agingColorHex(c.oldestDays)}"></span>

    moneyHTML = `

  const pipelineHTML = `

  /* === Team workload === */
  const workload = _workloadData(tasks);

  const workloadHTML = `
    <div class="card dash-card">

            const overflow = r.tasks.length > 25 ? `<span class="wl-overflow">+${r.tasks.length-25}</span>` : '';
            return `
              <div class="dash-wl-row" onclick="_dashDrill({assignee:'${r.actor}'})">
                <div class="wl-name ${isAdmin||isSup?'is-lead':''}">${escapeHTML(displayName(r.actor))}${badge}</div>

    </div>`;

  /* === Top clients + activity === */
  const topClients = _topClientsByOpen(tasks, 5);
  const topClientsHTML = `
    <div class="card dash-card">
      <div class="dash-card-head">
        <span class="dash-card-title"><span class="icn-chip chip-cyan">${icon('building')}</span> Top clients</span>
        <span class="row-sub">by open tasks</span>
      </div>
      ${topClients.length === 0 ? '<div class="muted" style="font-size:12px">No open tasks.</div>' :
        topClients.map(c => {
          const cells = c.taskRefs.map(tr => `<span class="dash-tc-cell" style="background:${statusColor[tr.status]||'var(--n300)'}" title="Open this task" onclick="event.stopPropagation();_dashDrill({focusId:'${tr.id}'})"></span>`).join("");
          return `
            <div class="dash-row-click" onclick="_dashDrill({client:'${escapeAttr(c.client)}'})">
              <span class="dash-ellipsis">${escapeHTML(c.client)}</span>
              <div class="tc-cells">${cells}</div>
              <span class="tc-count">${c.count}</span>
            </div>
          `;
        }).join("")
      }
    </div>`;

  const activity = _bucketActivityByTime(_groupedRecentActivity(10));
  const actLine = (a) => {
    const tag = a.count > 1 ? `<b style="font-weight:500">${a.count} tasks</b>` : `<b style="font-weight:500">"${escapeHTML(a.taskName)}"</b>`;
    let body = "";
    if (a.action === "status_changed") body = `${escapeHTML(displayName(a.by))} moved ${tag} to ${escapeHTML(a.to)}`;
    else if (a.action === "created") body = `${escapeHTML(displayName(a.by))} created ${tag}`;
    else if (a.action === "deleted") body = `${escapeHTML(displayName(a.by))} deleted ${tag}`;
    else if (a.action === "reassigned") body = `${escapeHTML(displayName(a.by))} reassigned ${tag}`;
    else body = `${escapeHTML(displayName(a.by))} ${escapeHTML(a.action)}`;
    const click = a.taskId ? ` class="act-line dash-act-line clickable" onclick="_dashDrill({focusId:'${a.taskId}'})"` : ' class="act-line"';
    return `<div${click}>${body}</div>`;
  };
  const actSection = (label, items) => items.length === 0 ? '' :
    `<div class="act-group-label">${label}</div>` + items.map(actLine).join("");
  const activityHTML = `
    <div class="card dash-card">
      <div class="dash-card-head">
        <span class="dash-card-title"><span class="icn-chip chip-gray">${icon('history')}</span> Recent activity</span>
        <a class="link" onclick="setTab('Activity')" style="font-size:11px">View all →</a>
      </div>
      ${actSection("TODAY", activity.today)}
      ${actSection("YESTERDAY", activity.yesterday)}
      ${actSection("EARLIER", activity.earlier)}
      ${(activity.today.length + activity.yesterday.length + activity.earlier.length) === 0 ? '<div class="muted" style="font-size:12px">Nothing logged yet.</div>' : ''}
    </div>`;

  return `
    <h2>Dashboard</h2>
    ${moneyHTML}
    ${kpiHTML}
    <div class="dash-grid-pipeline">${pipelineHTML}${stuckHTML}</div>
    ${workloadHTML}
    <div class="dash-grid-2">${topClientsHTML}${activityHTML}</div>
  `;
}

function activityRowHTML(a) {
  const dt = new Date(a.ts);
  const time = dt.toLocaleString("en-IN", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit", hour12:false });
  let desc = "";
  if (a.action === "created") {
    desc = `created task <a class="link" onclick="setTab('Admin',{focusId:'${a.taskId}'})">${escapeHTML(a.taskName)}</a>${a.client?` <span class="muted">(${escapeHTML(a.client)})</span>`:""}`;
  } else if (a.action === "status_changed") {
    desc = `changed <a class="link" onclick="setTab('Admin',{focusId:'${a.taskId}'})">${escapeHTML(a.taskName)}</a> from <span class="pill ${statusClass(a.from)}">${escapeHTML(a.from)}</span> → <span class="pill ${statusClass(a.to)}">${escapeHTML(a.to)}</span>`;
  } else if (a.action === "reassigned") {
    desc = `reassigned <a class="link" onclick="setTab('Admin',{focusId:'${a.taskId}'})">${escapeHTML(a.taskName)}</a> from <b>${escapeHTML(displayName(a.from))}</b> → <a class="link" onclick="setTab('${a.to}')">${escapeHTML(displayName(a.to))}</a>`;

/* ---- Acct & Final activity feed (separate stream, shown via switcher in Activity tab) ---- */
function _afRolePlain(role) { return role ? displayName(role) : "—"; }
/* Status value → coloured pill (same tint family as the task feed's pills) */
function afPill(v, kind) {
  let label = v;
  if (kind === "doc") label = (v === "" || v == null) ? "Not set" : v;
  else if (kind === "audit") label = v || "—";
  else label = (v === "" || v == null) ? "Not started" : v;
  const M = {
    "Done": "afp-green", "Received": "afp-green", "Filed": "afp-green", "Y": "afp-green", "Low": "afp-green",
    "Pending": "afp-yellow", "In progress": "afp-yellow", "In Progress": "afp-yellow", "In Process": "afp-yellow", "Moderate": "afp-yellow",
    "Recd from client": "afp-orange", "Sent to client": "afp-orange",
    "No Transaction": "afp-blue", "Financials Ready": "afp-blue",
    "Ready to review": "afp-teal", "Data Finalized": "afp-teal",
    "Report": "afp-purple", "Report Ready": "afp-purple",
    "N": "afp-red", "High": "afp-red"
  };
  return '<span class="pill ' + (M[label] || "afp-grey") + '">' + escapeHTML(label) + '</span>';
}
function afEvtText(e) {
  switch (e.action) {
    case "work":    return escapeHTML(e.field || "") + ": " + afPill(e.from) + " → " + afPill(e.to);
    case "doc":     return escapeHTML(e.field || "") + ": " + afPill(e.from, "doc") + " → " + afPill(e.to, "doc");
    case "chk":     return "checklist — " + escapeHTML(e.item || "") + ": " + (e.to === "Done" ? afPill("Done") : e.to === "NA" ? afPill("NA") : '<span class="pill afp-grey">Unticked</span>');
    case "stage":   return "audit stage: " + afPill(e.from) + " → " + afPill(e.to);
    case "audit":   return "audit flag: " + afPill(e.from, "audit") + " → " + afPill(e.to, "audit");
    case "target":  return e.to ? "target date set to <b>" + afFmtDate(e.to) + "</b>" : "target date cleared";
    case "remark":  return (e.field === "aRem" ? "accounting" : "finalisation") + " remark updated";
    case "assign":  return (e.field === "acct" ? "accountant" : "finaliser") + ": " + escapeHTML(_afRolePlain(e.from)) + " → <b>" + escapeHTML(_afRolePlain(e.to)) + "</b>";
    case "complex": return "complexity: " + afPill(e.from) + " → " + afPill(e.to);
    case "added":   return "<b>added client</b> to the module";
    case "deleted": return "<b>removed client</b> from the module";
  }
  return escapeHTML(e.action || "");
}
/* One update = one small chip in the Who-did-what cards, tinted by its result */
function afEvtChip(e) {
  const T = v => ({ "Done": "afp-green", "Received": "afp-green", "Filed": "afp-green", "Y": "afp-green",
    "No Transaction": "afp-blue", "Financials Ready": "afp-blue", "Data Finalized": "afp-teal",
    "Report Ready": "afp-purple", "In Progress": "afp-yellow", "In Process": "afp-yellow", "Pending": "afp-yellow",
    "Recd from client": "afp-orange", "Sent to client": "afp-orange", "N": "afp-red" }[v] || "");
  let txt = "", tint = "";
  switch (e.action) {
    case "work":   txt = (e.field || "") + " → " + (e.to || "Not started"); tint = T(e.to); break;
    case "doc":    txt = (e.field || "") + " → " + (e.to || "Not set"); tint = T(e.to); break;
    case "chk":    txt = (e.to === "Done" ? "✓ " : "") + (e.item || "") + (e.to === "NA" ? " — NA" : e.to === "" ? " unticked" : "");
                   tint = e.to === "Done" ? "afp-green" : ""; break;
    case "stage":  txt = "Stage → " + (e.to || "Not Started"); tint = T(e.to); break;
    case "audit":  txt = "Audit → " + (e.to || "—"); tint = T(e.to); break;
    case "target": txt = e.to ? "Target " + afFmtDate(e.to) : "Target cleared"; break;
    case "remark": txt = (e.field === "aRem" ? "Acc" : "Fin") + " remark updated"; break;
    case "assign": txt = (e.field === "acct" ? "Accountant" : "Finaliser") + " → " + (e.to ? displayName(e.to) : "—"); break;
    case "complex": txt = "Complexity → " + (e.to || "—"); break;
    case "added":  txt = "Client added"; break;
    case "deleted": txt = "Client removed"; break;
    default: txt = e.action || "";
  }
  return '<span class="pill af-evt-chip ' + tint + '">' + escapeHTML(txt) + '</span>';
}
function afActivityRowHTML(e) {
  const dt = new Date(e.ts);
  const time = dt.toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: false });
  return `<div class="feed-row"><span class="feed-time">${time}</span><span class="feed-by">${escapeHTML(displayName(e.by))}</span><span><b>${escapeHTML(e.client || "")}</b> — ${afEvtText(e)}</span></div>`;
}
/* Settings → Client Master: rows matching the search box, each carrying its ORIGINAL index
   in state.clients (renameMaster/removeMaster address clients by position). */
function _settingsClientRows() {
  const q = String(settingsClientSearch || "").toLowerCase().trim();
  let rows = (state.clients || []).map((c, i) => ({ c, i }));
  if (settingsClientMobF.length) {
    const has = c => String((state.clientMobile || {})[c] || "").replace(/\D/g, "").length >= 10;
    rows = rows.filter(({ c }) => settingsClientMobF.includes(has(c) ? "has" : "none"));
  }
  if (settingsClientUsedF.length) {
    const counts = getMasterUsageCounts("clients");
    rows = rows.filter(({ c }) => settingsClientUsedF.includes(String(counts[c] || 0)));
  }
  if (!q) return rows;
  return rows.filter(({ c }) =>
    String(c).toLowerCase().includes(q)
    || String((state.clientBusiness || {})[c] || "").toLowerCase().includes(q)
    || String((state.clientMobile || {})[c] || "").includes(q));
}
function _cliFArr(which) { return which === "mob" ? settingsClientMobF : settingsClientUsedF; }
function settingsCliFToggle(which, ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  settingsClientFOpen = settingsClientFOpen === which ? "" : which;
  rerenderMain();
}
function settingsCliFPick(which, val, on) {
  const a = _cliFArr(which), i = a.indexOf(val);
  if (on && i < 0) a.push(val);
  if (!on && i >= 0) a.splice(i, 1);
  rerenderMain();
}
function settingsCliFAll(which) {
  if (which === "mob") settingsClientMobF = []; else settingsClientUsedF = [];
  rerenderMain();
}
document.addEventListener("click", () => { if (settingsClientFOpen) { settingsClientFOpen = ""; rerenderMain(); } });
/* the funnel-in-a-heading version of the gst-cf checkbox filter */
function _cliFilterCf(which, opts) {
  const cur = _cliFArr(which), open = settingsClientFOpen === which;
  return '<span class="gst-cf gst-cf-inhead' + (open ? " open" : "") + '">'
    + '<button type="button" class="gst-cf-btn' + (cur.length ? " on" : "") + '" onclick="settingsCliFToggle(\'' + which + '\',event)"'
      + ' title="' + (which === "mob" ? "Filter by whether a mobile is on file" : "Filter by how many tasks use the client") + '">'
      + icon("filter", 11) + "</button>"
    + (open ? '<span class="gst-cf-menu" onclick="event.stopPropagation()">'
        + '<label class="gst-cf-opt all"><input type="checkbox"' + (cur.length ? "" : " checked")

function _actRangeWindow(range) {
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (range === 'today') return { start: startOfToday, end: Date.now() + 1000, label: 'today' };
  if (range === 'yesterday') return { start: startOfToday - 86400000, end: startOfToday, label: 'yesterday' };
  if (range === '3days') return { start: startOfToday - 2*86400000, end: Date.now() + 1000, label: 'last 3 days' };
  if (range === 'week') return { start: startOfToday - 6*86400000, end: Date.now() + 1000, label: 'last 7 days' };
  if (range === 'month') return { start: startOfToday - 29*86400000, end: Date.now() + 1000, label: 'last 30 days' };
  return { start: 0, end: Date.now() + 1000, label: 'all time' };
}
function _setActRange(range) {
  actRange = range;
  const win = _actRangeWindow(range);
  /* Format as YYYY-MM-DD for the date inputs and feed filter */
  const fmt = (ms) => {
    const d = new Date(ms);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + dd;
  };
  actFilter.from = fmt(win.start);
  actFilter.to   = fmt(win.end - 1000);
  rerenderMain();
}
function renderActivity() {
  if (typeof actRange === 'undefined') actRange = 'today';
  const win = _actRangeWindow(actRange);
  /* Per-actor summary in selected window */
  const winEvents = visibleActivityLog().filter(e => {
    const ts = new Date(e.ts).getTime();
    return ts >= win.start && ts < win.end;
  });
  const byActor = {};
  winEvents.forEach(e => {
    const a = e.by || '(unknown)';
    if (!byActor[a]) byActor[a] = { created: 0, status_changed: 0, reassigned: 0, deleted: 0, total: 0, doneByType: {}, billedByType: {} };
    if (byActor[a][e.action] !== undefined) byActor[a][e.action]++;
    byActor[a].total++;
    /* Rule: any transition from a pre-Done status -> any post-Done status counts as "done" credit.
       Pre-Done = Not Started / In Progress / On Hold / Ready for Review (or unset).
       Post-Done = Done / To Be Billed / Billed / Not to Bill / Received.
       Also credits a task CREATED directly in a post-Done status (from is unset ∈ pre-Done),
       so filing something straight as Done/Billed/Received still shows as done. */
    if ((e.action === 'status_changed' || e.action === 'created') && e.taskName) {
      const PRE  = new Set(['Not Started','In Progress','On Hold','Ready for Review','']);
      const POST = new Set(['Done','To Be Billed','Billed','Not to Bill','Received']);
      const fromS = (e.from == null ? '' : String(e.from));
      const toS   = (e.to   == null ? '' : String(e.to));
      if (PRE.has(fromS) && POST.has(toS)) {
        const cat = String(e.taskName).replace(/-others$/i, '').trim().toUpperCase();
        if (!byActor[a].doneByType[cat]) byActor[a].doneByType[cat] = [];
        byActor[a].doneByType[cat].push(e.client || '(unknown)');
      }
    }
  });
  /* Compute active tasks each actor is currently handling (assignee = actor, status active) */
  const activeByActor = {};
  state.tasks.forEach(t => {
    if (t.deleted) return;
    if (!ACTIVE_STATUSES.includes(t.status)) return;
    const a = t.assignee;
    if (!a) return;
    if (!activeByActor[a]) activeByActor[a] = {};
    const cat = String(t.task || '').replace(/-others$/i, '').trim().toUpperCase();
    if (!activeByActor[a][cat]) activeByActor[a][cat] = [];
    activeByActor[a][cat].push(t.client || '(no client)');
  });
  const actorSet = new Set([...Object.keys(byActor), ...Object.keys(activeByActor)]);
  const actorList = Array.from(actorSet).sort((a,b) => {
    const sa = (byActor[a] ? byActor[a].total : 0) + Object.values(activeByActor[a] || {}).reduce((s,v)=>s+v.length,0);
    const sb = (byActor[b] ? byActor[b].total : 0) + Object.values(activeByActor[b] || {}).reduce((s,v)=>s+v.length,0);
    return sb - sa;
  });
  /* ---- "Who did what" in Acct & Final mode (same Tasks / Acct & Final toggle as the feed).
     Per person: updates grouped BY CLIENT with Acc/Fin tags (hover a client for exactly what
     was done), green completed lines, and an amber pending block of their open assignments. */
  let afSummaryHTML = '';
  if (actFeedTab === 'af') {
    const afWin = visibleAfLog().filter(e => {
      const ts = new Date(e.ts).getTime();
      return ts >= win.start && ts < win.end;
    });
    const A = {};
    const ensure = p => A[p] || (A[p] = { n: 0, acc: {}, fin: {}, accDone: new Set(), finDone: new Set() });
    afWin.forEach(e => {
      const p = e.by; if (!p) return;
      const s = ensure(p); s.n++;
      const isAcc = e.action === 'work' || e.action === 'doc' || (e.action === 'remark' && e.field === 'aRem');
      /* Fin block tracks the finalisation CHECKLIST (and fin remarks) only — audit-stage
         changes are deliberately not shown here. */
      const isFin = e.action === 'chk' || (e.action === 'remark' && e.field === 'fRem');
      if (isAcc) {
        (s.acc[e.client] = s.acc[e.client] || []).push(e);
        if (e.done) s.accDone.add(e.client);
      } else if (isFin) {
        (s.fin[e.client] = s.fin[e.client] || []).push(e);
        if (e.done) s.finDone.add(e.client);
      }
    });
    let people = Object.keys(A);
    const _uu = state.session && state.session.user;
    if (!ADMINS.includes(_uu)) people = people.filter(p => p === _uu);
    people.sort((a, b) => A[b].n - A[a].n);
    const roleBadge = p => p === 'Super Admin' ? '<span class="role-badge super">SUPER</span>'
      : (ADMINS.includes(p) ? '<span class="role-badge admin">ADMIN</span>' : '');
    /* client row + one chip per update right below it, always visible */
    const catRows = obj => {
      const keys = Object.keys(obj).sort((x, y) => obj[y].length - obj[x].length);
      return keys.slice(0, 12).map(c => {
        const evts = obj[c];
        const chips = evts.slice(0, 6).map(afEvtChip).join('')
          + (evts.length > 6 ? `<span class="pill af-evt-chip">+ ${evts.length - 6} more</span>` : '');

  let feed = [...visibleActivityLog()].reverse();

  if (actFilter.action) feed = feed.filter(a => a.action === actFilter.action);

  if (actFilter.to) { const tts = new Date(actFilter.to).getTime() + 86400000; feed = feed.filter(a => new Date(a.ts).getTime() < tts); }
  const actorOpts = visibleHeatmapActors().map(a => `<option value="${a}" ${actFilter.by===a?'selected':''}>${escapeHTML(displayName(a))}</option>`).join("");
  return `
    <h2>Activity Log</h2>
    <div class="card">
      <div class="act-head-row">

      </div>
      ${actFeedTab === 'af' ? afFeedHTML() : `
      <div class="feed-filters">
        <select onchange="actFilter.by=this.value;rerenderMain()">
          <option value="">All Actors</option>${actorOpts}

        <select onchange="actFilter.action=this.value;rerenderMain()">
          <option value="">All Actions</option>
          <option value="created" ${actFilter.action==="created"?"selected":""}>Created</option>
          <option value="status_changed" ${actFilter.action==="status_changed"?"selected":""}>Status Changed</option>
          <option value="reassigned" ${actFilter.action==="reassigned"?"selected":""}>Reassigned</option>

        <input type="date" value="${actFilter.from}" onchange="actFilter.from=this.value;rerenderMain()" title="From date" />
        <input type="date" value="${actFilter.to}" onchange="actFilter.to=this.value;rerenderMain()" title="To date" />
        <button class="clear-filters" onclick="actFilter={by:'',action:'',from:'',to:''};actRange='';feedSearch='';rerenderMain()">Clear all</button>
      </div>
      <div class="table-meta">Showing ${feed.length} of ${state.activityLog.length} events</div>

    </div>`;
}

/* ============== Fees Management (Super Admin only) ============== */
let feesFilter = { category: 'GST Annual', status: 'all', search: '' };
let feesSort = { col: null, dir: 'asc' };
function setFeesSort(col) {
  if (feesSort.col === col) {
    if (feesSort.dir === 'asc') feesSort.dir = 'desc';
    else { feesSort.col = null; feesSort.dir = 'asc'; }
  } else {
    feesSort.col = col; feesSort.dir = 'asc';
  }
  rerenderMain();
}
/* rerenderMain() rebuilds the whole view, so the input being typed into is destroyed and
   focus is lost — you could only ever enter one character before having to click again.
   Same problem the task tables solve in setFilter(): re-find the replacement input by its
   data attribute after the re-render and restore focus + caret. setSelectionRange throws on
   number inputs in some browsers, hence the inner try. */
function _feesRestoreFocus(key) {
  try {
    const el = document.querySelector('[data-fees-filter="' + key + '"]');
    if (!el) return;
    el.focus();
    const len = String(el.value == null ? '' : el.value).length;
    try { el.setSelectionRange(len, len); } catch (e) {}
  } catch (e) {}
}
function setFeesSearch(val) { feesFilter.search = val; rerenderMain(); _feesRestoreFocus('search'); }
function clearFeesFilters() {
  feesFilter = { category: feesFilter.category || 'GST Annual', status: 'all', search: '' };
  rerenderMain();
}
function _feesSortArrow(col) {
  if (feesSort.col !== col) return '';
  return feesSort.dir === 'asc' ? ' <span style="font-size:9px;color:var(--muted)">▲</span>' : ' <span style="font-size:9px;color:var(--muted)">▼</span>';
}
function _feesApplySort(rows) {
  if (!feesSort.col) return rows;
  const col = feesSort.col;
  const dir = feesSort.dir === 'asc' ? 1 : -1;
  const val = (e) => {
    if (col === 'tradeName') return String(e.tradeName||'').toLowerCase();
    if (col === 'contact')   return String(e.contactPerson||'').toLowerCase();
    if (col === 'mobile')    return String(e.mobile||'');
    if (col === 'lastYear')  return e.lastYearFees == null ? -Infinity : Number(e.lastYearFees);
    if (col === 'billAmount')return e.billAmount == null ? -Infinity : Number(e.billAmount);
    if (col === 'recdAmount')return e.recdAmount == null ? -Infinity : Number(e.recdAmount);
    if (col === 'outstanding')return (e.billAmount||0) - (e.recdAmount||0);
    if (col === 'status')    return String(e.status||'');
    return '';
  };
  return [...rows].sort((a,b) => { const va = val(a); const vb = val(b); return va < vb ? -dir : va > vb ? dir : 0; });
}


function _feesEntries() { return (Array.isArray(state.feesEntries) ? state.feesEntries : []).filter(e => e && !e.deleted); }

function _feesRupee(n) { return (n != null && !isNaN(n)) ? '₹' + Number(n).toLocaleString('en-IN') : ''; }

/* ==================== GSTIN / mobile validation ====================
   A GSTIN is 15 chars: 2-digit state code, 10-char PAN, 1 entity digit, 'Z', 1 check digit.
   The final character is a checksum over the first 14 (weighted alternately 1,2; summed as
   quotient+remainder mod 36), so a single mistyped character is caught — a format-only test
   would happily accept 24AFDPP0439E1ZA. Both fields stay OPTIONAL; they are only validated
   when something has been entered, so existing rows and part-filled entries are unaffected. */
const _GST_CH = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function _gstinChecksumOk(g) {
  let sum = 0;
  for (let i = 0; i < 14; i++) {
    const v = _GST_CH.indexOf(g[i]);
    if (v < 0) return false;
    const p = v * (i % 2 === 0 ? 1 : 2);
    sum += Math.floor(p / 36) + (p % 36);
  }
  return _GST_CH[(36 - (sum % 36)) % 36] === g[14];
}
function _gstinError(raw) {
  const g = String(raw == null ? '' : raw).toUpperCase().trim();
  if (!g) return '';
  if (g.length !== 15) return 'GSTIN must be 15 characters — you entered ' + g.length + '.';
  if (!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)) return 'Not a valid GSTIN format. Expected e.g. 24AAAAA0000A1Z5.';
  if (!_gstinChecksumOk(g)) return 'GSTIN check digit is wrong — please re-check the number.';
  return '';
}
/* Strip a pasted country code / trunk zero BEFORE truncating, or "+919876543210" would be
   cut to "9198765432" — a plausible-looking but wrong number that passes every later check. */
function _normalizeMobileInput(raw) {
  let d = String(raw == null ? '' : raw).replace(/\D/g, '');
  if (d.length === 12 && d.slice(0, 2) === '91') d = d.slice(2);
  else if (d.length === 11 && d[0] === '0') d = d.slice(1);
  return d.slice(0, 10);
}
function _mobileError(raw) {
  const d = _normalizeMobileInput(raw);
  if (!d) return '';
  if (d.length !== 10) return 'Mobile must be exactly 10 digits — you entered ' + d.length + '.';
  if (!/^[6-9]/.test(d)) return 'An Indian mobile number starts with 6, 7, 8 or 9.';
  return '';
}
/* Live feedback as they type: red border + message under the field. */
function _feesValidateField(el, kind) {
  if (!el) return true;
  const err = kind === 'gstin' ? _gstinError(el.value) : _mobileError(el.value);
  const box = document.getElementById(el.id + 'Err');
  if (box) { box.textContent = err; box.style.display = err ? 'block' : 'none'; }
  el.style.borderColor = err ? 'var(--danger-text)' : 'var(--border)';
  return !err;
}

function addFeesEntry() {
  const trade = document.getElementById('feesNewTrade').value.trim();
  if (!trade) { alert('Trade name required.'); return; }
  const gEl = document.getElementById('feesNewGstin');
  const mEl = document.getElementById('feesNewMobile');
  const gErr = _gstinError(gEl && gEl.value);
  if (gErr) { _feesValidateField(gEl, 'gstin'); alert(gErr); if (gEl) gEl.focus(); return; }
  const mErr = _mobileError(mEl && mEl.value);
  if (mErr) { _feesValidateField(mEl, 'mobile'); alert(mErr); if (mEl) mEl.focus(); return; }
  const entry = {
    id: 'fee_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    category: 'GST Annual',
    tradeName: trade,
    gstin: document.getElementById('feesNewGstin').value.trim().toUpperCase(),
    contactPerson: document.getElementById('feesNewContact').value.trim(),
    mobile: _normalizeMobileInput(document.getElementById('feesNewMobile').value),
    lastYearFees: Number(document.getElementById('feesNewLastYear').value) || null,
    billAmount: Number(document.getElementById('feesNewBillAmt').value) || null,
    recdAmount: null,
    userName: '',
    remarks: '',
    status: 'pending',
    mt: Date.now()
  };
  if (!Array.isArray(state.feesEntries)) state.feesEntries = [];
  state.feesEntries.push(entry);
  ['feesNewTrade','feesNewGstin','feesNewContact','feesNewMobile','feesNewLastYear','feesNewBillAmt'].forEach(id => {
    const el = document.getElementById(id); if (el) { el.value = ''; el.style.borderColor = 'var(--border)'; }
    const errBox = document.getElementById(id + 'Err'); if (errBox) { errBox.textContent = ''; errBox.style.display = 'none'; }
  });
  save(); rerenderMain();
  setTimeout(() => { const el = document.getElementById('feesNewTrade'); if (el) el.focus(); }, 0);
}

function setFeesField(id, field, value) {
  const e = _feesEntries().find(x => x.id === id);
  if (!e) return;
  if (field === 'billAmount' || field === 'recdAmount' || field === 'lastYearFees') {
    e[field] = value === '' ? null : Math.max(0, Math.floor(Number(value)) || 0);
  } else if (field === 'mobile') {
    e[field] = String(value || '').replace(/\D/g,'').slice(0,10);
  } else {
    e[field] = value;
  }
  e.mt = Date.now();
  save();
  if (field === 'status') rerenderMain();
}

function deleteFeesEntry(id) {
  if (!confirm('Delete this fees entry?')) return;
  const e = (state.feesEntries || []).find(x => x && x.id === id);
  if (!e) return;
  /* Tombstone, not hard-remove: a hard-removed entry reappears when another tab's stale copy
     merges back in. The tombstone wins the per-entry merge; migrate() purges old ones. */
  e.deleted = true; e.deletedAt = Date.now(); e.mt = Date.now();
  save(); rerenderMain();
}

/* Undo a wrongly-marked payment: clears the received amount so the row shows outstanding
   again. Confirm first; fresh mt so the change wins the per-entry merge on every device. */
function undoFeesReceived(id) {
  const e = _feesEntries().find(x => x.id === id);
  if (!e) return;
  const amt = (e.recdAmount != null) ? ('₹' + Number(e.recdAmount).toLocaleString('en-IN')) : '';
  if (!confirm('Undo the received payment' + (amt ? ' of ' + amt : '') + ' for "' + (e.tradeName || '') + '"?\nThe fee will show as outstanding again.')) return;
  e.recdAmount = null;
  e.mt = Date.now();
  save(); rerenderMain();
}
function markFeesReceived(id) {
  const e = _feesEntries().find(x => x.id === id);
  if (!e || e.billAmount == null) return;
  e.recdAmount = e.billAmount;
  e.mt = Date.now();
  save(); rerenderMain();
}

function renderFees() {
  const all = _feesEntries();
  const query = (feesFilter.search || '').toLowerCase().trim();
  let filtered = all.filter(e => {
    if (feesFilter.status !== 'all' && e.status !== feesFilter.status) return false;
    if (query) {
      const hay = ((e.tradeName || '') + ' ' + (e.gstin || '') + ' ' + (e.mobile || '') + ' ' + (e.contactPerson || '') + ' ' + (e.userName || '')).toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });
  filtered = _feesApplySort(filtered);

  const totals = all.reduce((acc, e) => {
    acc.count++;
    if (e.status === 'raised') { acc.raised++; acc.billed += (e.billAmount || 0); acc.received += (e.recdAmount || 0); }
    else if (e.status === 'not_raised') acc.notRaised++;
    else acc.pending++;
    return acc;
  }, { count: 0, raised: 0, pending: 0, notRaised: 0, billed: 0, received: 0 });
  totals.outstanding = totals.billed - totals.received;

  const statusPill = (s) => {
    const map = { raised: ['Raised','var(--st-dn-bg)','var(--st-dn-fg)'], not_raised: ['Not Raised','var(--st-ns-bg)','var(--st-ns-fg)'], pending: ['Pending','var(--st-oh-bg)','var(--st-oh-fg)'] };
    const arr = map[s] || ['Pending','var(--n100)','var(--n500)'];
    return `<span style="background:${arr[1]};color:${arr[2]};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500">${arr[0]}</span>`;
  };

  const statusOptions = [
    { v: 'pending', label: 'Pending' },
    { v: 'raised', label: 'Raised' },
    { v: 'not_raised', label: 'Not Raised' }
  ];

  const rowsHTML = filtered.length === 0
    ? `<tr><td colspan="10" class="empty" style="padding:20px;text-align:center">No entries match filters.</td></tr>`
    : filtered.map((e, i) => {
        const outstanding = (e.billAmount || 0) - (e.recdAmount || 0);
        const statusSel = statusOptions.map(o => `<option value="${o.v}" ${e.status===o.v?'selected':''}>${o.label}</option>`).join('');
        return `<tr data-fees-id="${escapeAttr(e.id)}">
          <td class="num">${i+1}</td>
          <td>
            <div style="font-weight:500">${escapeHTML(e.tradeName || '')}</div>
            <div style="font-size:10px;color:var(--muted)">${escapeHTML(e.gstin || '')}${e.userName ? ' · ' + escapeHTML(e.userName) : ''}</div>
          </td>
          <td style="font-size:11px">${escapeHTML(e.contactPerson || '')}</td>
          <td style="font-size:11px;white-space:nowrap">${_feeMobCell(e.mobile, e)}</td>
          <td style="text-align:right;color:var(--muted);font-size:11px">${_feesRupee(e.lastYearFees)}</td>
          <td><input type="number" min="0" value="${e.billAmount != null ? e.billAmount : ''}" onchange="setFeesField('${e.id}','billAmount',this.value)" onclick="this.select()" placeholder="₹" style="width:78px;padding:3px 6px;border:1px solid var(--border);border-radius:3px;text-align:right;font-family:inherit;font-size:12px" title="Bill amount" /></td>
          <td><input type="number" min="0" value="${e.recdAmount != null ? e.recdAmount : ''}" onchange="setFeesField('${e.id}','recdAmount',this.value)" onclick="this.select()" placeholder="—" style="width:78px;padding:3px 6px;border:1px solid var(--border);border-radius:3px;text-align:right;font-family:inherit;font-size:12px;background:var(--accent-soft)" title="Received amount" /></td>
          <td style="text-align:right;font-weight:${outstanding > 0 ? '500' : '400'};color:${outstanding > 0 ? 'var(--viz-late)' : (outstanding === 0 && e.billAmount ? 'var(--viz-ok)' : 'var(--muted)')};font-size:12px">${outstanding ? _feesRupee(outstanding) : (e.billAmount && e.recdAmount === e.billAmount ? '✓ paid' : '')}</td>
          <td><select onchange="setFeesField('${e.id}','status',this.value)" style="font-size:11px;padding:3px 4px;border:1px solid var(--border);border-radius:3px;background:#fff">${statusSel}</select></td>
          <td style="white-space:nowrap">
            ${e.status === 'raised' && (e.recdAmount || 0) < (e.billAmount || 0) ? `<button onclick="markFeesReceived('${e.id}')" style="background:var(--st-dn-bg);color:var(--st-dn-fg);border:1px solid var(--dot-dn);padding:2px 6px;border-radius:3px;cursor:pointer;font-size:10px;margin-right:2px" title="Mark as fully received">✓ Recd</button>` : ''}
            ${(e.recdAmount || 0) > 0 ? `<button onclick="undoFeesReceived('${e.id}')" style="background:var(--st-oh-bg,#fff7ed);color:var(--st-oh-fg,#9a3412);border:1px solid var(--st-oh-fg,#f59e0b);padding:2px 6px;border-radius:3px;cursor:pointer;font-size:10px;margin-right:2px" title="Wrongly marked as paid? Undo — the fee shows as outstanding again">↩ Undo</button>` : ''}
            <button class="del del-icon" onclick="deleteFeesEntry('${e.id}')" title="Delete entry" aria-label="Delete entry">${icon('trash',12)}</button>
          </td>

function addTaskGeneric(idPrefix, defaultAssignee) {
  const task = getTaskValue(idPrefix + "Task").trim();
  const clients = getAllClientValues(idPrefix);
  const assignee = document.getElementById(idPrefix + "Assignee").value || defaultAssignee;
  const status = document.getElementById(idPrefix + "Status").value || "Not Started";
  const remarks = document.getElementById(idPrefix + "Remarks").value.trim();
  if (!task) { alert("Pick a task from the list, or choose 'Other' to specify a new one."); return; }
  if (clients.length === 0) { alert("Pick a client from the suggestions, or click the '+' to add it as a new client (with mobile)."); return; }
  /* One task per client — the "Add another client" rows let you file the same task for several clients at once. */
  clients.forEach((client) => {
    const id = genTaskId();
    const row = { id, task, client, assignee, status, remarks, mt: Date.now(), createdAt: Date.now() };
    /* Filed straight into a closed status? then it was completed now. */
    if (_POST_DONE.includes(status)) row.doneAt = Date.now();
    /* Default amount when a task is created directly in an amount-carrying status (same as status-change flow) */
    if (AMOUNT_STATUSES.includes(status) && DEFAULT_AMOUNTS[task]) row.amount = DEFAULT_AMOUNTS[task];
    state.tasks.push(row);
    maybeAddMaster(client, null);
    logActivity(id, "created", null, status);
  });
  save(); render();
  /* The inline add-row survives the re-render (state keeps it open) but re-rendering blanks
     its fields and drops focus — put the cursor back so several tasks can be filed in a run. */
  setTimeout(() => { const el = document.getElementById(idPrefix + "Task"); if (el) el.focus(); }, 0);
}
